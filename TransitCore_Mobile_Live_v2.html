<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>TransitCore Mobile Live v2</title>
<style>
:root{
  color-scheme:dark;
  --bg:#101010; --panel:#171717; --muted:#8d8d8d;
  --off:#353535; --lian:#00e66b; --ila:#18a9ff; --warn:#ffd54a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{
  min-height:100vh;
  padding:max(10px,env(safe-area-inset-top)) 10px max(16px,env(safe-area-inset-bottom));
}
header{
  position:sticky;top:0;z-index:10;background:rgba(16,16,16,.94);
  backdrop-filter:blur(10px);padding:5px 0 10px;
}
h1{font-size:21px;text-align:center;margin:5px 0 5px}
#status{font-size:12px;color:#bbb;text-align:center;line-height:1.35;min-height:18px}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:#aaa;margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.board{
  max-width:460px;margin:8px auto 0;padding:12px 10px;
  background:var(--panel);border:1px solid #292929;border-radius:12px;
}
.station{
  display:grid;grid-template-columns:minmax(118px,1fr) 42px;align-items:center;
  min-height:34px;
}
.name{font-size:13px;text-align:right;padding-right:14px}
.light-area{display:flex;justify-content:center;align-items:center}
.dot{
  width:11px;height:11px;border-radius:50%;background:var(--off);
  transition:background .18s,box-shadow .18s,transform .18s;
}
.dot.lian{background:var(--lian);box-shadow:0 0 6px var(--lian),0 0 16px rgba(0,230,107,.7)}
.dot.ila{background:var(--ila);box-shadow:0 0 6px var(--ila),0 0 16px rgba(24,169,255,.7)}
.dot.both{
  background:#f4f4f4;
  box-shadow:0 0 6px #fff,0 0 18px rgba(255,255,255,.7);
}
.segment{
  display:grid;grid-template-columns:minmax(118px,1fr) 42px;
  min-height:22px;
}
.segment-spacer{}
.segment-lights{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.segment .dot{width:7px;height:7px}
.error{color:#ff7373!important}
.ok{color:#9fdaa9!important}
.small{font-size:10px;color:#777;text-align:center;margin:10px 0 0}
@media(min-width:700px){
  h1{font-size:24px}.board{max-width:520px}.name{font-size:14px}
}
</style>
</head>
<body>
<header>
  <h1>🚋 Gråkallbanen Live</h1>
  <div id="status">Starter…</div>
  <div class="legend">
    <span><i class="dot lian"></i> mot Lian</span>
    <span><i class="dot ila"></i> mot Ila</span>
  </div>
</header>

<main class="board" id="board"></main>
<div class="small">TransitCore Mobile Live v2 · oppdaterer hvert 10. sekund</div>

<script>
"use strict";

const ENTUR_URL = "https://api.entur.io/realtime/v2/vehicles/graphql";
const REFRESH_MS = 10000;
const ARRIVAL_RADIUS_M = 65;

const STATIONS = [
  {name:"Lian",lat:63.402909,lon:10.314250},
  {name:"Herlofsonløypa",lat:63.405185,lon:10.320049},
  {name:"Vestmarka",lat:63.406483,lon:10.325116},
  {name:"Kyvannet",lat:63.404107,lon:10.337601},
  {name:"Ugla",lat:63.400533,lon:10.343923},
  {name:"Ferstad",lat:63.399498,lon:10.349037},
  {name:"Munkvoll",lat:63.397756,lon:10.359984},
  {name:"Rognheim",lat:63.399425,lon:10.373459},
  {name:"Søndre Hoem",lat:63.403350,lon:10.381672},
  {name:"Nordre Hoem",lat:63.405587,lon:10.381037},
  {name:"Breidablikk",lat:63.412348,lon:10.377005},
  {name:"Belvedere",lat:63.416226,lon:10.376340},
  {name:"Bygrensen",lat:63.418824,lon:10.375680},
  {name:"Nyveibakken",lat:63.424354,lon:10.372478},
  {name:"Bergsli gate",lat:63.427819,lon:10.367510},
  {name:"Ila",lat:63.429279,lon:10.368299}
];

function rad(v){return v*Math.PI/180}
function distanceMeters(aLat,aLon,bLat,bLon){
  const R=6371000;
  const p1=rad(aLat),p2=rad(bLat);
  const dp=rad(bLat-aLat),dl=rad(bLon-aLon);
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function ledCountForSegment(i){
  const a=STATIONS[i], b=STATIONS[i+1];
  const m=distanceMeters(a.lat,a.lon,b.lat,b.lon);
  if(m<300)return 1;if(m<550)return 2;if(m<850)return 3;if(m<1200)return 4;return 5;
}

function buildBoard(){
  const root=document.getElementById("board");
  root.innerHTML="";
  STATIONS.forEach((s,i)=>{
    const st=document.createElement("div");
    st.className="station";
    st.innerHTML=`<div class="name">${s.name}</div><div class="light-area"><div class="dot" id="st${i}"></div></div>`;
    root.appendChild(st);
    if(i<STATIONS.length-1){
      const count=ledCountForSegment(i);
      const seg=document.createElement("div");
      seg.className="segment";
      let dots="";
      for(let j=0;j<count;j++) dots+=`<div class="dot" id="sg${i}_${j}"></div>`;
      seg.innerHTML=`<div class="segment-spacer"></div><div class="segment-lights">${dots}</div>`;
      root.appendChild(seg);
    }
  });
}

function clearLights(){
  document.querySelectorAll(".board .dot").forEach(d=>d.className="dot");
}

function directionOf(v){
  const d=(v.destination||"").toLowerCase();
  if(d.includes("lian")) return "lian";
  if(d.includes("ila")) return "ila";
  return "ila";
}

function activate(id,dir){
  const el=document.getElementById(id); if(!el)return;
  if(el.classList.contains("lian") && dir==="ila" || el.classList.contains("ila") && dir==="lian"){
    el.className="dot both";
  }else{
    el.className="dot "+dir;
  }
}

function localXY(lat,lon,refLat){
  return {x:lon*111320*Math.cos(rad(refLat)),y:lat*111320};
}

function locateVehicle(v){
  let bestStation=-1,bestStationDistance=Infinity;
  STATIONS.forEach((s,i)=>{
    const d=distanceMeters(v.lat,v.lon,s.lat,s.lon);
    if(d<bestStationDistance){bestStationDistance=d;bestStation=i}
  });
  if(bestStationDistance<=ARRIVAL_RADIUS_M){
    return {type:"station",index:bestStation,distance:bestStationDistance};
  }

  let best=null;
  for(let i=0;i<STATIONS.length-1;i++){
    const a=STATIONS[i],b=STATIONS[i+1],ref=(a.lat+b.lat+v.lat)/3;
    const p=localXY(v.lat,v.lon,ref), A=localXY(a.lat,a.lon,ref), B=localXY(b.lat,b.lon,ref);
    const vx=B.x-A.x,vy=B.y-A.y,len2=vx*vx+vy*vy;
    let t=((p.x-A.x)*vx+(p.y-A.y)*vy)/len2;
    t=Math.max(0,Math.min(1,t));
    const qx=A.x+t*vx,qy=A.y+t*vy;
    const dist=Math.hypot(p.x-qx,p.y-qy);
    if(!best||dist<best.distance)best={type:"segment",segment:i,progress:t,distance:dist};
  }
  return best;
}

function render(vehicles){
  clearLights();
  vehicles.forEach(v=>{
    const dir=directionOf(v), loc=locateVehicle(v);
    if(!loc)return;
    if(loc.type==="station"){
      activate(`st${loc.index}`,dir);
    }else{
      const count=ledCountForSegment(loc.segment);
      const idx=Math.min(count-1,Math.max(0,Math.floor(loc.progress*count)));
      activate(`sg${loc.segment}_${idx}`,dir);
    }
  });
}

function freshness(v){
  const t=Date.parse(v.lastUpdated||"");
  return Number.isFinite(t)?t:0;
}
function dedupe(items){
  const map=new Map();
  items.forEach(v=>{
    const old=map.get(v.id);
    if(!old || freshness(v)>freshness(old)) map.set(v.id,v);
  });
  return [...map.values()];
}

async function fetchVehicles(){
  const query=`{
    vehicles(codespaceId:"ATB"){
      vehicleId
      lastUpdated
      destinationName
      line{publicCode}
      location{latitude longitude}
    }
  }`;
  const response=await fetch(ENTUR_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json","ET-Client-Name":"lgb-grakallboard-mobile"},
    body:JSON.stringify({query})
  });
  if(!response.ok) throw new Error("Entur HTTP "+response.status);
  const json=await response.json();
  if(json.errors?.length) throw new Error(json.errors[0].message||"GraphQL-feil");
  const raw=json?.data?.vehicles||[];
  return dedupe(raw
    .filter(v=>String(v?.line?.publicCode||"")==="9" && v?.location)
    .map(v=>({
      id:String(v.vehicleId),
      lastUpdated:v.lastUpdated||"",
      destination:v.destinationName||"",
      lat:Number(v.location.latitude),
      lon:Number(v.location.longitude)
    }))
    .filter(v=>Number.isFinite(v.lat)&&Number.isFinite(v.lon))
  );
}

async function refresh(){
  const status=document.getElementById("status");
  try{
    status.className="";
    status.textContent="Henter live-data…";
    const vehicles=await fetchVehicles();
    render(vehicles);
    const time=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
    status.className="ok";
    status.textContent=`${vehicles.length} aktive vogner · oppdatert ${time}`;
  }catch(err){
    console.error(err);
    status.className="error";
    status.textContent="Live-data kunne ikke hentes: "+err.message;
  }
}

buildBoard();
refresh();
setInterval(refresh,REFRESH_MS);
</script>
</body>
</html>
