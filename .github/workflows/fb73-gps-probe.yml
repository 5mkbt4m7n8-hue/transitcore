name: FB73 public GPS source probe
on:
  pull_request:
    paths:
      - 'scripts/probe-fb73-gps.mjs'
      - '.github/workflows/fb73-gps-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Probe public Entur positions by codespace (read-only)
        run: node scripts/probe-fb73-gps.mjs
