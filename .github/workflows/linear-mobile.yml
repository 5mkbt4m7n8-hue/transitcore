name: Linear mobile and GPS Debug tests
on:
  pull_request:
    paths:
      - 'core/**'
      - 'web/linear/**'
      - 'web/shared/**'
      - 'scripts/test-linear-mobile-integration.mjs'
      - 'scripts/test-canonical-frame-fetch.mjs'
      - 'scripts/browser-linear-fetch.mjs'
      - 'scripts/test-intransit-map.mjs'
      - 'scripts/test-linear-cloud-draft.mjs'
      - 'scripts/test-linear-publish.mjs'
      - 'scripts/test-linear-live-monitor.mjs'
      - 'scripts/test-tonstad-live-test.mjs'
      - 'scripts/test-line1-route-progress.mjs'
      - 'scripts/test-line1-incident-evidence.mjs'
      - 'scripts/test-multiline-route-progress.mjs'
      - 'scripts/test-gps-v2-route-shadow.mjs'
      - 'scripts/test-gps-v21-multiple-quays.mjs'
      - 'scripts/test-gps-v21-comparison-log.mjs'
      - 'scripts/test-trondheim-gps-v22.mjs'
      - 'scripts/test-trondheim-gps-v23.mjs'
      - 'worker/trondheim-gps-v22.mjs'
      - 'web/linear/gps-v22-quality.html'
      - 'web/linear/network/gps-v20-baseline.js'
      - 'web/linear/network/gps-v2-comparison-log.js'
      - 'web/linear/network/gps-v2-shadow.js'
      - 'scripts/test-verified-entur-patterns.mjs'
      - 'scripts/test-multiline-scheduled-quality.mjs'
      - 'scripts/test-trondheim-anomaly-radar.mjs'
      - 'scripts/test-trondheim-rendered-gps-conflicts.mjs'
      - 'scripts/test-trondheim-gps-source-reconciliation.mjs'
      - 'scripts/test-trondheim-strict-gps-shadow.mjs'
      - 'worker/trondheim-strict-shadow.mjs'
      - 'config/gps/trondheim-quay-competitors-shadow.json'
      - 'scripts/test-trondheim-source-repeated-triage.mjs'
      - 'web/linear/network/source-reconciliation-triage.js'
      - 'worker/trondheim-gps-source-reconciliation.mjs'
      - 'worker/trondheim-rendered-gps-conflicts.mjs'
      - 'web/linear/network/anomaly-radar.js'
      - 'worker/trondheim-multiline-quality.mjs'
      - 'worker/trondheim-history.mjs'
      - 'config/gps/**'
      - 'scripts/test-line1-quality-report.mjs'
      - 'scripts/test-line1-corridor-quality.mjs'
      - 'web/linear/network/line1-corridor-quality.js'
      - 'scripts/test-trondheim-day-history.mjs'
      - 'scripts/test-line1-scheduled-quality.mjs'
      - 'scripts/test-line1-fast-history.mjs'
      - 'worker/trondheim-line1-fast.mjs'
      - 'worker/wrangler.toml'
      - 'worker/trondheim-line1-quality.mjs'
      - 'worker/trondheim-history.mjs'
      - 'worker/linear-draft.mjs'
      - 'worker/linear-publish.mjs'
      - 'worker/led-feed-worker.mjs'
      - 'scripts/browser-intransit-map.mjs'
      - 'scripts/audit-intransit-route-evidence.mjs'
      - '.github/workflows/linear-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web/linear/**'
      - 'web/shared/**'
      - 'scripts/test-linear-mobile-integration.mjs'
      - 'scripts/test-canonical-frame-fetch.mjs'
      - 'scripts/browser-linear-fetch.mjs'
      - 'scripts/test-intransit-map.mjs'
      - 'scripts/test-linear-cloud-draft.mjs'
      - 'scripts/test-linear-publish.mjs'
      - 'scripts/test-linear-live-monitor.mjs'
      - 'scripts/test-tonstad-live-test.mjs'
      - 'scripts/test-line1-route-progress.mjs'
      - 'scripts/test-line1-incident-evidence.mjs'
      - 'scripts/test-multiline-route-progress.mjs'
      - 'scripts/test-gps-v2-route-shadow.mjs'
      - 'scripts/test-gps-v21-multiple-quays.mjs'
      - 'scripts/test-gps-v21-comparison-log.mjs'
      - 'scripts/test-trondheim-gps-v22.mjs'
      - 'scripts/test-trondheim-gps-v23.mjs'
      - 'worker/trondheim-gps-v22.mjs'
      - 'web/linear/gps-v22-quality.html'
      - 'web/linear/network/gps-v20-baseline.js'
      - 'web/linear/network/gps-v2-comparison-log.js'
      - 'web/linear/network/gps-v2-shadow.js'
      - 'scripts/test-verified-entur-patterns.mjs'
      - 'config/gps/**'
      - 'scripts/test-line1-quality-report.mjs'
      - 'scripts/test-line1-corridor-quality.mjs'
      - 'web/linear/network/line1-corridor-quality.js'
      - 'scripts/test-trondheim-day-history.mjs'
      - 'scripts/test-line1-scheduled-quality.mjs'
      - 'scripts/test-line1-fast-history.mjs'
      - 'worker/trondheim-line1-fast.mjs'
      - 'worker/wrangler.toml'
      - 'worker/trondheim-line1-quality.mjs'
      - 'worker/trondheim-history.mjs'
      - 'worker/linear-draft.mjs'
      - 'worker/linear-publish.mjs'
      - 'worker/led-feed-worker.mjs'
      - 'scripts/browser-intransit-map.mjs'
      - 'scripts/audit-intransit-route-evidence.mjs'
      - '.github/workflows/linear-mobile.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify Linear production defaults and opt-in Bus1 GPS Debug
        run: node scripts/test-linear-mobile-integration.mjs

      - name: Verify bounded frame fetch, validation and recovery
        run: node scripts/test-canonical-frame-fetch.mjs

      - name: Verify InTransit layout, mapping and editor
        run: node scripts/test-intransit-map.mjs

      - name: Verify protected persistent Linear cloud drafts
        run: node scripts/test-linear-cloud-draft.mjs

      - name: Verify GitHub map publication uses a saved cloud revision
        run: node scripts/test-linear-publish.mjs

      - name: Verify read-only live monitor and diagnostic reasons
        run: node scripts/test-linear-live-monitor.mjs

      - name: Verify Tonstadkrysset source-confirmed vs GPS-only live panel
        run: node scripts/test-tonstad-live-test.mjs

      - name: Verify line 1 A-B-C observation state machine and lost-frame events
        run: node scripts/test-line1-route-progress.mjs

      - name: Verify explainable GPS/SIRI tracking-break evidence and two-frame threshold
        run: node scripts/test-line1-incident-evidence.mjs

      - name: Verify browser-only V2 GPS route-ordered Quay shadow
        run: node scripts/test-gps-v2-route-shadow.mjs

      - name: Verify V2.1 retained Quay candidates and delayed source-order disambiguation
        run: node scripts/test-gps-v21-multiple-quays.mjs

      - name: Compare original V2.0 and V2.1 against the same live frame and anonymous 24h rollups
        run: node scripts/test-gps-v21-comparison-log.mjs

      - name: Verify unattended, anonymous Cloudflare GPS V2.2 quality report
        run: node scripts/test-trondheim-gps-v22.mjs

      - name: Verify GPS V2.3 dual-line fast sampling and source evidence continuity
        run: node scripts/test-trondheim-gps-v23.mjs

      - name: Verify source-certified Line 1 and 11 route tracking and privacy
        run: node scripts/test-multiline-route-progress.mjs

      - name: Verify 43 Entur sourced lines with exact Quay adjacency and safe exclusions
        run: node scripts/test-verified-entur-patterns.mjs

      - name: Verify unattended multi-line quality rollups and source isolation
        run: node scripts/test-multiline-scheduled-quality.mjs

      - name: Verify Trondheim multi-line anomaly radar and source-only route sections
        run: node scripts/test-trondheim-anomaly-radar.mjs

      - name: Verify scoped rendered GPS direction conflicts in scheduled quality
        run: node scripts/test-trondheim-rendered-gps-conflicts.mjs

      - name: Verify source-to-render GPS disposition and bounded history rollup
        run: node scripts/test-trondheim-gps-source-reconciliation.mjs

      - name: Shadow test PR279 strict 60 vs 85 metres and competing Quays
        run: node scripts/test-trondheim-strict-gps-shadow.mjs

      - name: Verify source-to-render repeated-frame triage and calendar-day integrity
        run: node scripts/test-trondheim-source-repeated-triage.mjs

      - name: Verify Line 1 quality counts and five-minute recording coverage
        run: node scripts/test-line1-quality-report.mjs

      - name: Verify Line 1 pattern-section hotspot ranking and historical day comparison
        run: node scripts/test-line1-corridor-quality.mjs

      - name: Verify Trondheim one-day history and pinned demo
        run: node scripts/test-trondheim-day-history.mjs

      - name: Verify unattended Line 1 source evidence in five-minute scheduled history
        run: node scripts/test-line1-scheduled-quality.mjs

      - name: Verify Line 1 interleaved GPS-only sampling and day-history merging
        run: node scripts/test-line1-fast-history.mjs

      - name: Audit schematic route coverage without fetching live data
        env:
          INTRANSIT_AUDIT_DIR: artifacts/intransit-map
        run: node scripts/audit-intransit-route-evidence.mjs

      - name: Install pinned Playwright and Chromium (no deploy)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser smoke test and review screenshots
        env:
          INTRANSIT_SCREENSHOT_DIR: artifacts/intransit-map
        run: node scripts/browser-intransit-map.mjs

      - name: Browser regression for frame recovery and direction legend
        run: node scripts/browser-linear-fetch.mjs

      - name: Upload InTransit review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intransit-map-review
          path: |
            artifacts/intransit-map/*.png
            artifacts/intransit-map/route-evidence-audit.json
          if-no-files-found: warn
          retention-days: 7
