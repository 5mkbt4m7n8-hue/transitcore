name: Bus 1 test profile
on:
  pull_request:
    paths: ['config/**', 'core/**', 'worker/**', 'scripts/test-bus1-visual-bench.mjs', '.github/workflows/bus1-profile-candidate.yml']
  push:
    branches: [main]
    paths: ['config/**', 'core/**', 'worker/**', 'scripts/test-bus1-visual-bench.mjs', '.github/workflows/bus1-profile-candidate.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/test-bus1-visual-bench.mjs
