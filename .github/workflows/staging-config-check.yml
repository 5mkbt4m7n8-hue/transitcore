name: Staging configuration safety (no deploy)
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
jobs:
  bootstrap-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Never execute PR code in this privileged event. Only base policy runs.
      - name: Check actual immutable PR diff with trusted base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          node scripts/staging-deploy-guard.mjs --bootstrap-diff "$GITHUB_WORKSPACE" "$BASE_SHA" "$HEAD_SHA" --if-staging
