name: API v1 compatibility
on:
  pull_request:
    paths: ['core/**', 'worker/**', 'config/**', 'web/**', 'scripts/test-canonical-*', 'scripts/test-unified-*', 'scripts/*fleet-dashboard.mjs', 'scripts/test-fleet-soak.mjs', 'scripts/test-api-v1.mjs', 'scripts/test-health-telemetry.mjs', 'scripts/test-device-status.mjs', '.github/workflows/api-v1.yml']
  push:
    branches: [main]
    paths: ['core/**', 'worker/**', 'config/**', 'web/**', 'scripts/test-canonical-*', 'scripts/test-unified-*', 'scripts/*fleet-dashboard.mjs', 'scripts/test-fleet-soak.mjs', 'scripts/test-api-v1.mjs', 'scripts/test-health-telemetry.mjs', 'scripts/test-device-status.mjs', '.github/workflows/api-v1.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/test-api-v1.mjs
          node scripts/test-health-telemetry.mjs
          node scripts/test-fleet-dashboard.mjs
          node scripts/test-fleet-soak.mjs
          node scripts/test-device-status.mjs
          node scripts/test-device-diagnostics.mjs
          node scripts/test-frame-pipeline.mjs
          node scripts/test-entur-provider.mjs
          node scripts/test-stop-accuracy.mjs
          node scripts/test-bus1-activation-parity.mjs
          node scripts/test-unified-bus-engine.mjs
          node scripts/test-unified-release.mjs
          node scripts/test-unified-staging.mjs
          node scripts/test-canonical-frame-client.cjs
          node scripts/test-canonical-diagnostics.cjs
          node scripts/test-canonical-web-syntax.mjs
          node scripts/test-web-preservation.cjs
