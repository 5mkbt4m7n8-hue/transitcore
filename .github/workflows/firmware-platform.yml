name: Firmware platform 1.3
on:
  pull_request:
    paths: ['firmware/esp32/**', 'scripts/*esp13*', 'scripts/test-firmware-platform.mjs', 'core/models/health-status.mjs', 'config/boards/**', 'config/hardware/**', '.github/workflows/firmware-platform.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/test-esp13-compile-fixtures.mjs
          node scripts/test-firmware-edge-cases.mjs
          node scripts/test-firmware-platform.mjs
          node scripts/test-health-telemetry.mjs
          node scripts/test-api-v1.mjs
          node scripts/test-frame-pipeline.mjs
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install ArduinoJson "Adafruit NeoPixel"
          node scripts/prepare-esp13-compile.mjs
      - run: |
          set -euo pipefail
          for sketch in .build/esp13-sketches/*; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3 "$sketch"
            arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 "$sketch"
          done
