name: Trondheim quality production proof (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/trondheim-quality-proof.yml'
      - 'scripts/probe-trondheim-quality-live.mjs'
      - 'scripts/test-trondheim-quality-proof.mjs'
      - 'scripts/test-trondheim-source-priority-live.mjs'
      - 'scripts/probe-trondheim-strict-root-causes-live.mjs'
      - 'scripts/test-trondheim-strict-root-causes.mjs'
      - 'worker/trondheim-strict-shadow.mjs'
      - 'worker/trondheim-gps-v22.mjs'
      - 'scripts/test-trondheim-gps-v22.mjs'
      - 'scripts/test-trondheim-gps-v23.mjs'
      - 'scripts/test-trondheim-gps-v24.mjs'
      - 'scripts/test-trondheim-gps-v25.mjs'
      - 'worker/trondheim-gps-v25.mjs'
      - 'scripts/probe-trondheim-gps-v22-live.mjs'
      - 'scripts/test-trondheim-gps-v22-daily-audit.mjs'
      - 'scripts/probe-trondheim-source-priorities-live.mjs'
      - 'web/linear/network/source-reconciliation-triage.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/trondheim-quality-proof.yml'
      - 'scripts/probe-trondheim-quality-live.mjs'
      - 'scripts/test-trondheim-quality-proof.mjs'
      - 'scripts/test-trondheim-source-priority-live.mjs'
      - 'scripts/probe-trondheim-strict-root-causes-live.mjs'
      - 'scripts/test-trondheim-strict-root-causes.mjs'
      - 'worker/trondheim-strict-shadow.mjs'
      - 'worker/trondheim-gps-v22.mjs'
      - 'scripts/test-trondheim-gps-v22.mjs'
      - 'scripts/test-trondheim-gps-v23.mjs'
      - 'scripts/test-trondheim-gps-v24.mjs'
      - 'scripts/test-trondheim-gps-v25.mjs'
      - 'worker/trondheim-gps-v25.mjs'
      - 'scripts/probe-trondheim-gps-v22-live.mjs'
      - 'scripts/test-trondheim-gps-v22-daily-audit.mjs'
      - 'scripts/probe-trondheim-source-priorities-live.mjs'
      - 'web/linear/network/source-reconciliation-triage.js'
  # Three lightweight public GET checks per day; no new Entur polling.
  schedule:
    - cron: '12 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-quality-proof:
    name: Read production history and verify latest source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test GPS V2.3 dual-line scheduled telemetry and nonpersistent identity
        run: node scripts/test-trondheim-gps-v23.mjs
      - name: Verify V2.4 memory integrity and per-frame GPS primary continuity
        run: node scripts/test-trondheim-gps-v24.mjs
      - name: Verify bounded V2.5 HMAC state restored across cold starts with alarm expiry
        run: node scripts/test-trondheim-gps-v25.mjs
      - name: Test Cloudflare V2.2 anonymous proof and report schema
        run: node scripts/test-trondheim-gps-v22.mjs
      - name: Protect privacy of the V2.2 daily audit and verify source counters
        run: node scripts/test-trondheim-gps-v22-daily-audit.mjs
      - name: Prove whether V2.2 aggregate recording is active in the actual Cloudflare Worker
        run: node scripts/probe-trondheim-gps-v22-live.mjs
      - name: Offline proof contract regression
        run: node scripts/test-trondheim-quality-proof.mjs
      - name: Test anonymous 47-line source priority audit
        run: node scripts/test-trondheim-source-priority-live.mjs
      - name: Validate GPS rejection-only reason separation and source Quay geometry
        run: node scripts/test-trondheim-strict-root-causes.mjs
      - name: Read named Lerkendal and Tonstadkrysset Quay topology and strict GPS causes
        # Reads only public aggregate metadata and bundled public geometry.
        run: node scripts/probe-trondheim-strict-root-causes-live.mjs
      - name: Verify actual live multi-line and Quay source data
        # This check reports source outages and old Worker deployments as
        # explicit evidence in the step summary, not as source-code CI failures.
        run: node scripts/probe-trondheim-quality-live.mjs
      - name: Inspect observed line 1, 11 and other repeated source-to-map candidates
        # Separate second public GET for anonymous aggregates only.
        # Missing provider evidence is reported, never called a GPS failure.
        run: node scripts/probe-trondheim-source-priorities-live.mjs
