name: InTransit Mini ESP32 portable core and OLED build
on:
  pull_request:
    paths:
      - 'firmware/mini/**'
      - 'web/mini/model.js'
      - 'scripts/test-mini-firmware-parity.mjs'
      - '.github/workflows/intransit-mini-firmware.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/mini/**'
      - 'web/mini/model.js'
      - 'scripts/test-mini-firmware-parity.mjs'
      - '.github/workflows/intransit-mini-firmware.yml'
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build C++17 hardware-independent display motor
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I firmware/mini/include firmware/mini/test/test_mini_core.cpp \
            -o /tmp/intransit-mini-core-test
      - name: Run portable screen and source-mode regressions
        run: /tmp/intransit-mini-core-test
      - name: Compare every C++ layout profile with web Mini
        run: node scripts/test-mini-firmware-parity.mjs /tmp/intransit-mini-core-test
  oled-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Compile the OLED DEMO ESP32-S3 firmware
        run: pio run -d firmware/mini -e mini_oled
  driver-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Add compile-only pin assignments (NEVER use to wire hardware)
        run: |
          cat >> firmware/mini/platformio.ini <<'EOF'
          [env:mini_hub75_ci]
          extends = env:mini_hub75
          build_flags =
            ${env:mini_hub75.build_flags}
            -D MINI_PIN_R1=1
            -D MINI_PIN_G1=2
            -D MINI_PIN_B1=3
            -D MINI_PIN_R2=4
            -D MINI_PIN_G2=5
            -D MINI_PIN_B2=6
            -D MINI_PIN_A=7
            -D MINI_PIN_B=8
            -D MINI_PIN_C=9
            -D MINI_PIN_D=10
            -D MINI_PIN_E=11
            -D MINI_PIN_LAT=12
            -D MINI_PIN_OE=13
            -D MINI_PIN_CLK=14

          [env:mini_tft_ci]
          extends = env:mini_tft
          build_flags =
            ${env:mini_tft.build_flags}
            -D MINI_TFT_CONFIGURED=1
            -D USER_SETUP_LOADED=1
            -D ST7789_DRIVER=1
            -D TFT_WIDTH=135
            -D TFT_HEIGHT=240
            -D TFT_MISO=-1
            -D TFT_MOSI=7
            -D TFT_SCLK=6
            -D TFT_CS=10
            -D TFT_DC=9
            -D TFT_RST=8
            -D LOAD_GLCD=1
            -D SPI_FREQUENCY=27000000
          EOF
      - name: Compile HUB75 64x64 DMA adapter (never flash CI pin profile)
        run: pio run -d firmware/mini -e mini_hub75_ci
      - name: Compile TFT ST7789 adapter (never flash CI pin profile)
        run: pio run -d firmware/mini -e mini_tft_ci
