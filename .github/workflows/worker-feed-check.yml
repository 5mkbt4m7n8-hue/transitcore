name: Worker feed checks
on:
  pull_request:
    paths: ["worker/**", "config/**", "scripts/test-feed-timing.mjs", ".github/workflows/worker-feed-check.yml"]
  push:
    branches: [main]
    paths: ["worker/**", "config/**", "scripts/test-feed-timing.mjs", ".github/workflows/worker-feed-check.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/test-feed-timing.mjs
          node scripts/test-led-feed-worker.mjs
          node scripts/test-arrival-selection.mjs
          node scripts/test-departure-memory.mjs
          node scripts/test-empty-feed-hold.mjs
          node scripts/test-device-status.mjs
          node scripts/test-device-diagnostics.mjs
