name: Visual backend contracts
on:
  pull_request:
    paths: ['config/**', 'core/**', 'worker/**', 'scripts/test-runtime-visual-backend.mjs', 'scripts/test-trondheim-canonical.mjs', '.github/workflows/visual-backend-candidate.yml']
  push:
    branches: [main]
    paths: ['config/**', 'core/**', 'worker/**', 'scripts/test-runtime-visual-backend.mjs', 'scripts/test-trondheim-canonical.mjs', '.github/workflows/visual-backend-candidate.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/test-runtime-visual-backend.mjs
          node scripts/test-trondheim-canonical.mjs
