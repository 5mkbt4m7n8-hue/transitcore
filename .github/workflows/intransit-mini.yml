name: InTransit Mini display simulator
on:
  pull_request:
    paths:
      - 'web/mini/**'
      - 'worker/mini-departures.mjs'
      - 'worker/mini-stop-search.mjs'
      - 'scripts/test-mini-stop-search.mjs'
      - 'worker/api/v1.mjs'
      - 'scripts/test-intransit-mini.mjs'
      - 'scripts/browser-intransit-mini.mjs'
      - 'scripts/probe-mini-entur.mjs'
      - '.github/workflows/intransit-mini.yml'
  push:
    branches: [main]
    paths:
      - 'web/mini/**'
      - 'worker/mini-departures.mjs'
      - 'worker/api/v1.mjs'
      - 'scripts/test-intransit-mini.mjs'
      - 'scripts/browser-intransit-mini.mjs'
permissions:
  contents: read
jobs:
  mini:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check display profiles, Entur contract and independent API
        run: node scripts/test-intransit-mini.mjs
      - name: Validate Entur v3 stop search and departure filter model
        run: node scripts/test-mini-stop-search.mjs
      - name: Live Entur stopPlace schema probe (nonblocking)
        continue-on-error: true
        run: node scripts/probe-mini-entur.mjs
      - name: Install pinned Chromium for offline Mini browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test LED/OLED/TFT views, export, live errors and mobile
        run: node scripts/browser-intransit-mini.mjs
