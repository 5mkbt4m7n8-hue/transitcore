name: Tonstad SIRI live feed tests
on:
  pull_request:
    paths:
      - 'worker/tonstad-live-source.mjs'
      - 'worker/led-feed-worker.mjs'
      - 'core/engines/entur-stop-evidence.mjs'
      - 'core/engines/entur-trip-pattern-link.mjs'
      - 'core/engines/entur-shared-quay-context.mjs'
      - 'core/providers/entur/siri-vm-stop-parser.mjs'
      - 'core/providers/entur/siri-vm-journey-parser.mjs'
      - 'config/gps/atb-journey-patterns-1-11.json'
      - 'scripts/test-tonstad-live-source.mjs'
      - '.github/workflows/tonstad-source-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-join:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test strict source identity and one-LED projection
        run: node scripts/test-tonstad-live-source.mjs
      - name: Check integrated worker syntax
        run: node --check worker/led-feed-worker.mjs
