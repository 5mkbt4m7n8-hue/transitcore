name: Board Studio millimetres and Chromium
on:
  pull_request:
    paths:
      [
        "web/board-studio/**",
        "scripts/*board-studio.mjs",
        "scripts/fixtures/board-studio-*.mjs",
        ".github/workflows/board-studio.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "web/board-studio/**",
        "scripts/*board-studio.mjs",
        "scripts/fixtures/board-studio-*.mjs",
        ".github/workflows/board-studio.yml",
      ]
permissions:
  contents: read
jobs:
  board-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/test-board-studio.mjs
          node scripts/test-authoring-board-studio.mjs
          node scripts/test-v03-board-studio.mjs
          node scripts/test-v031-board-studio.mjs
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/board-browser" playwright
          "$RUNNER_TEMP/board-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chromium interaction and download tests
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/board-browser/node_modules/playwright" BOARD_SCREENSHOT="$RUNNER_TEMP/board-studio.png" node scripts/browser-board-studio.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/board-browser/node_modules/playwright" BOARD_AUTHORING_SCREENSHOT="$RUNNER_TEMP/board-studio-authoring.png" node scripts/browser-authoring-board-studio.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/board-browser/node_modules/playwright" BOARD_V03_SCREENSHOT="$RUNNER_TEMP/board-studio-v03.png" node scripts/browser-v03-board-studio.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/board-browser/node_modules/playwright" BOARD_V031_SCREENSHOT="$RUNNER_TEMP/board-studio-v031.png" node scripts/browser-v031-board-studio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-studio-chromium
          path: ${{ runner.temp }}/board-studio*.png
