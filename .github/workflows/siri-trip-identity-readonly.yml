name: GPS V2.17 SIRI trip identity (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/siri-trip-identity-readonly.yml'
      - 'scripts/audit_siri_trip.py'
      - 'scripts/test_siri_trip.py'
      - 'docs/siri-trip-identity-v217.md'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline identity and sequence regressions
        run: python3 -m unittest discover -s scripts -p test_siri_trip.py -v
      - name: Two bounded public Entur GETs, no production writes
        run: python3 scripts/audit_siri_trip.py
      - name: Preserve source IDs, times, hashes and ordered calls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: siri-trip-identity-v217
          path: work/siri-trip-audit.json
          retention-days: 7
          if-no-files-found: error
