name: Entur lines 1 and 11 source JourneyPatterns audit
on:
  pull_request:
    paths:
      - 'scripts/probe-entur-line-patterns.mjs'
      - '.github/workflows/entur-line-patterns.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Inspect ordered source Quays without any vehicle data
        run: node scripts/probe-entur-line-patterns.mjs
