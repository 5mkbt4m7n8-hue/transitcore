name: Platform model contracts
on:
  pull_request:
    paths: ['core/models/**', 'config/**', 'scripts/test-platform-models.mjs', '.github/workflows/platform-models.yml']
  push:
    branches: [main]
    paths: ['core/models/**', 'config/**', 'scripts/test-platform-models.mjs', '.github/workflows/platform-models.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-platform-models.mjs
