name: GPS route-sequence candidate tests
on:
  pull_request:
    paths:
      - 'core/engines/route-progress.mjs'
      - 'scripts/test-route-progress.mjs'
      - 'scripts/test-route-progress-durable.mjs'
      - 'core/engines/entur-stop-evidence.mjs'
      - 'core/engines/strict-station-gps.mjs'
      - 'scripts/test-entur-shared-quay-projection.mjs'
      - 'scripts/shared-quay-frame-shadow.mjs'
      - 'scripts/test-shared-quay-frame-shadow.mjs'
      - 'scripts/test-entur-stop-evidence.mjs'
      - 'core/providers/entur/siri-vm-stop-parser.mjs'
      - 'scripts/test-siri-vm-stop-parser.mjs'
      - 'core/engines/entur-stop-projection.mjs'
      - 'scripts/test-entur-provider-projection.mjs'
      - 'core/engines/entur-trip-pattern-link.mjs'
      - 'core/engines/entur-shared-quay-context.mjs'
      - 'scripts/test-entur-shared-quay-context.mjs'
      - 'scripts/probe-entur-shared-quay-shadow.mjs'
      - 'scripts/shared-quay-diagnostic-format.mjs'
      - 'scripts/test-shared-quay-diagnostic-format.mjs'
      - 'core/engines/entur-trip-terminus.mjs'
      - 'scripts/test-entur-trip-terminus.mjs'
      - 'config/routes/atb-bus-1-live.json'
      - 'scripts/test-entur-trip-pattern-link.mjs'
      - 'config/gps/atb-journey-patterns-1-11.json'
      - 'core/providers/entur/siri-vm-journey-parser.mjs'
      - 'scripts/test-siri-dated-trip-join.mjs'
      - 'scripts/probe-entur-dated-journey-join.mjs'
      - 'core/engines/source-quay-sequence-shadow.mjs'
      - 'scripts/test-source-quay-sequence-shadow.mjs'
      - 'scripts/probe-entur-multi-stop-shadow.mjs'
      - '.github/workflows/route-progress-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          node scripts/test-route-progress.mjs
          node scripts/test-route-progress-durable.mjs
          node scripts/test-entur-stop-evidence.mjs
          node scripts/test-siri-vm-stop-parser.mjs
          node scripts/test-entur-provider-projection.mjs
          node scripts/test-entur-shared-quay-projection.mjs
          node scripts/test-shared-quay-frame-shadow.mjs
          node scripts/test-entur-trip-pattern-link.mjs
          node scripts/test-siri-dated-trip-join.mjs
          node scripts/test-entur-trip-terminus.mjs
          node scripts/test-entur-shared-quay-context.mjs
          node scripts/test-shared-quay-diagnostic-format.mjs
          node --check scripts/probe-entur-shared-quay-shadow.mjs
          node --check scripts/probe-entur-dated-journey-join.mjs
          node scripts/test-source-quay-sequence-shadow.mjs
          node --check scripts/probe-entur-multi-stop-shadow.mjs
