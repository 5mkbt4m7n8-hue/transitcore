name: Entur service-journey lookup pilot (read only)
on:
  pull_request:
    paths:
      - 'scripts/probe-entur-service-journey-list.mjs'
      - '.github/workflows/entur-service-journey-list.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check reference journey and dated-journey availability
        run: node scripts/probe-entur-service-journey-list.mjs
