name: Provider compatibility
on:
  pull_request:
    paths: ['core/**', 'worker/**', 'config/**', 'scripts/test-entur-provider.mjs', '.github/workflows/provider-contracts.yml']
  push:
    branches: [main]
    paths: ['core/**', 'worker/**', 'config/**', 'scripts/test-entur-provider.mjs', '.github/workflows/provider-contracts.yml']
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node scripts/test-entur-provider.mjs
          node scripts/test-platform-models.mjs
          node scripts/test-led-feed-worker.mjs
          node scripts/test-feed-timing.mjs
