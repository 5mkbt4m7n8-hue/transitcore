name: Live GPS route-sequence shadow replay (read only)
on:
  pull_request:
    paths:
      - 'scripts/probe-route-progress-shadow.mjs'
      - '.github/workflows/route-progress-live-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Observe route direction over time without affecting LEDs
        run: node scripts/probe-route-progress-shadow.mjs
