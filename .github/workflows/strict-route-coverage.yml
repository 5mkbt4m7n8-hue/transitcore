name: Read-only strict route GPS coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read-only Entur fleet sample; output aggregated coverage only
        run: node scripts/probe-strict-route-coverage.mjs
