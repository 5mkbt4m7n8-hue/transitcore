name: InTransit geographic map unit tests
on:
  pull_request:
    paths:
      - 'web/linear/geo/**'
      - 'web/linear/live/**'
      - 'web/linear/diagnostics/**'
      - 'scripts/browser-intransit-diagnostics.mjs'
      - 'scripts/browser-intransit-live.mjs'
      - 'scripts/browser-intransit-all.mjs'
      - 'scripts/browser-intransit-demo.mjs'
      - 'scripts/test-intransit-geo.mjs'
      - 'scripts/browser-intransit-geo.mjs'
      - '.github/workflows/intransit-geo.yml'
  push:
    branches: [main]
    paths:
      - 'web/linear/geo/**'
      - 'scripts/test-intransit-geo.mjs'
      - '.github/workflows/intransit-geo.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate coordinate candidates, manual placement, GeoJSON and geographic UI syntax
        run: node scripts/test-intransit-geo.mjs
      - name: Install pinned Playwright, Chromium and Leaflet for offline browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 leaflet@1.9.4
          npx playwright install --with-deps chromium
      - name: Test geography editor in real Chromium (OSM tiles mocked)
        run: node scripts/browser-intransit-geo.mjs
      - name: Test standalone mobile line 1 live map in same Chromium install
        run: node scripts/browser-intransit-live.mjs
      - name: Test all catalogued lines together in real Chromium
        run: node scripts/browser-intransit-all.mjs
      - name: Test public diagnostics in Chromium and 390px mobile
        run: node scripts/browser-intransit-diagnostics.mjs
      - name: Test DEMO, GPS isolation and full fleet on mobile
        run: node scripts/browser-intransit-demo.mjs
