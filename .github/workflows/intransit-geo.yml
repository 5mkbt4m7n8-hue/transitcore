name: InTransit geographic map unit tests
on:
  pull_request:
    paths:
      - 'web/linear/geo/**'
      - 'scripts/test-intransit-geo.mjs'
      - '.github/workflows/intransit-geo.yml'
  push:
    branches: [main]
    paths:
      - 'web/linear/geo/**'
      - 'scripts/test-intransit-geo.mjs'
      - '.github/workflows/intransit-geo.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate coordinate candidates, manual placement, GeoJSON and geographic UI syntax
        run: node scripts/test-intransit-geo.mjs
