; InTransit Mini – isolated PlatformIO project, ESP32-S3 prototype.
; All builds boot in explicitly marked DEMO mode unless changed privately.
; No GPIO numbers or external display controller are guessed.
[platformio]
default_envs = mini_oled

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=1

; Portable core + physically attached SSD1306 OLED (I2C).
; Check actual SDA/SCL wiring on YOUR ESP32-S3 board before powering.
[env:mini_oled]
build_flags =
  ${env.build_flags}
  -D MINI_PANEL_OLED
  -D MINI_WIDTH=128
  -D MINI_HEIGHT=64
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit SSD1306@^2.5.13

; HUB75 (e.g., your 64x64 RGB matrix): supply ALL MINI_PIN_* GPIO definitions
; in your local environment config and verify 5V power, shared GND, panel scan.
; This template intentionally refuses to compile without confirmed pinout.
[env:mini_hub75]
build_flags =
  ${env.build_flags}
  -D MINI_PANEL_HUB75
  -D MINI_WIDTH=64
  -D MINI_HEIGHT=64
  ; Required, after checking the ESP32-S3 adapter:
  ; -D MINI_PIN_R1=<gpio> ... MINI_PIN_CLK=<gpio> (14 fields)
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GFX Library@^1.12.1
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.14

; TFT_eSPI requires a User_Setup for the panel's driver, dimensions and pins.
; The TFT environment intentionally does not prescribe controller/GPIO.
; Add -D USER_SETUP_LOADED and your validated TFT_* pin + driver defines.
[env:mini_tft]
build_flags =
  ${env.build_flags}
  -D MINI_PANEL_TFT
  -D MINI_WIDTH=240
  -D MINI_HEIGHT=135
  -D MINI_TFT_ROTATION=1
  ; REQUIRED: -D MINI_TFT_CONFIGURED=1 once setup/pins are provided
  ; e.g. -D USER_SETUP_LOADED=1 -D ST7789_DRIVER=1 -D TFT_MOSI=...
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
