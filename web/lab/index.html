<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>TransitCore Multi-Line Lab v6</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#303030;--muted:#999;--accent:#ffd54a}
[hidden]{display:none!important}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
main{max-width:760px;margin:auto} h1{font-size:23px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.toolbar{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:12px}
select,button,.toolbar-link{font:inherit;color:#fff;background:#252525;border:1px solid #444;border-radius:8px;padding:10px}button{cursor:pointer}button:hover,.toolbar-link:hover{border-color:#777}.toolbar-link{text-decoration:none;text-align:center}
#status{font-size:12px;color:#bbb;margin:10px 3px;min-height:18px}.ok{color:#9fdaa9!important}.error{color:#ff8585!important}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:#222;border:1px solid #333;border-radius:999px;padding:5px 9px;font-size:12px;color:#ccc}
.route,.cards{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stop{display:grid;grid-template-columns:1fr 44px;min-height:34px;align-items:center}.stop-name{text-align:right;padding-right:14px;font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;background:#3b3b3b;margin:auto}.segment{height:18px;border-left:2px solid #353535;margin-left:calc(100% - 23px)}
.card{border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0;background:#202020}.card-head{display:flex;justify-content:space-between;gap:10px}.vehicle{font-weight:700}.dest{color:#ddd}
.meta{font-size:12px;color:#aaa;margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}.empty{text-align:center;color:#888;padding:30px 10px}
.live-route{position:relative;min-height:820px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 86px 24px 14px}.live-line{position:absolute;right:54px;top:34px;bottom:34px;width:4px;border-radius:4px;background:#3a3a3a}.live-stop{position:absolute;left:14px;right:47px;transform:translateY(-50%);display:grid;grid-template-columns:1fr 18px;align-items:center}.live-stop-name{text-align:right;padding-right:12px;font-size:12px;color:#ccc}.live-stop-name small{display:block;color:#777;font-size:9px}.live-stop-dot{width:9px;height:9px;border-radius:50%;background:#777;margin:auto}.bus{position:absolute;right:12px;transform:translateY(-50%);width:72px;min-height:30px;border-radius:7px;padding:4px 5px;color:#101010;font-size:10px;font-weight:800;text-align:center;box-shadow:0 0 13px #0008;z-index:3}.bus small{display:block;font-size:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bus .vled{font-size:9px;font-weight:900}.offroute{opacity:.42}
.bus.estimated{border:1px dashed #fff9}.live-stop-dot.arriving{animation:stationPulse 1s ease-in-out infinite}@keyframes stationPulse{50%{transform:scale(1.7)}}
.note{font-size:12px;color:#929292;line-height:1.45;margin-top:12px;padding:0 3px}
.multi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:14px}.multi-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.multi-panel h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}.multi-panel iframe{display:block;width:100%;height:920px;border:0;background:var(--bg)}
.route-picker{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}.route-picker h2{font-size:15px;margin:0 0 10px}.quick-picks,.route-checks{display:flex;gap:8px;flex-wrap:wrap}.route-checks{margin-top:10px}.route-check{display:flex;align-items:center;gap:6px;background:#222;border:1px solid #383838;border-radius:8px;padding:8px 10px;font-size:12px}.route-check input{accent-color:var(--accent)}
body.embedded{padding:8px}body.embedded main{max-width:none}body.embedded h1,body.embedded .sub,body.embedded .toolbar,body.embedded .note{display:none}body.embedded #status{margin-top:0}
@media(max-width:520px){body{padding:10px}.toolbar{grid-template-columns:1fr}.toolbar button{width:100%}.multi-grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body><main>
<h1>TransitCore Multi-Line Lab</h1>
<div class="sub">Kanonisk PixelFrame · serveren bestemmer LED og tilstand</div>
<div class="toolbar"><select id="profile"></select><button id="refresh">Oppdater nå</button><button id="showAll">Vis alle samtidig</button><a class="toolbar-link" href="../board/">LED-tavle</a></div>
<div id="status">Laster profiler…</div><div id="summary" class="summary"></div><section id="view"></section>
<section id="routePicker" class="route-picker" hidden><h2>Velg ruter på tavlen</h2><div class="quick-picks" id="quickPicks"></div><div class="route-checks" id="routeChecks"></div></section>
<section id="multiView" class="multi-grid" hidden></section>
<p class="note">LIVE viser serverens LED-indekser og tilstander. Rå GPS, ETA og fysisk ankomst beregnes ikke i nettleseren.</p>
</main>
<script src="../shared/board-client-model.js"></script><script src="../shared/canonical-frame-client.js"></script><script>
"use strict";
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
if(params.get("embedded")==="1")document.body.classList.add("embedded");
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const boardIds=["trondheim-bus-board","trondheim-city-lines-catalog","trondheim-flybuss-live","grakallbanen-board","oslo-metro-board"];
let boards=[],profiles=[],client,active,timer,generation=0,selectedRoute=params.get("route");
async function json(path){const r=await fetch(path);if(!r.ok)throw Error("HTTP "+r.status+" "+path);return r.json();}
function paint(result){
 const frame=result.frame;
 const route=selectedRoute,routeProfile=profiles.find(p=>p.id===route);
 const leds=(frame?.leds||[]).filter(led=>!routeProfile||[led.vehicle,...(led.occupants||[])].some(v=>v?.routeId===route||String(v?.line)===String(routeProfile.line.publicCode)));
 $("status").textContent=active.id+" · "+result.algorithm+" · frame "+result.sample.sequence+" · "+(frame?.generatedAt||"")+" · alder "+result.sample.ageSeconds+" s · "+result.sample.status;
 $("view").className="cards";
 $("view").innerHTML=leds.length?leds.map(led=>'<article class="card"><div class="card-head"><b>LED '+led.id+'</b><span>'+esc(led.lifecycle||led.state)+'</span></div><div class="meta">Kjøretøy '+esc(led.vehicle?.id||"Ikke rapportert")+' · linje '+esc(led.vehicle?.line||"")+' · '+esc(led.vehicle?.destination||"")+'</div></article>').join(""):'<div class="empty">Ingen aktive LED-er i gyldig frame.</div>';
}
async function refresh(){clearTimeout(timer);if(document.hidden||!client)return;const g=generation,result=await client.refresh();if(g===generation)paint(result);timer=setTimeout(refresh,10000);}
function select(){generation++;active=boards.find(b=>b.id===$("profile").value);client=TransitCoreFrames.create({boardId:active.id,ledCount:active.leds.count});$("summary").textContent="Kanonisk PixelFrame · ingen lokal GPS-/ETA-tolkning";refresh();}
function selectedRouteIds(){
 const requested=params.get("routes");
 return profiles.filter(p=>requested===null||requested.split(",").includes(p.id)).map(p=>p.id);
}
function setMultiRoutes(ids){
 const query=new URLSearchParams({multi:"1",routes:ids.join(",")});location.search="?"+query;
}
function renderMulti(){
 clearTimeout(timer);generation++;client=null;
 $("profile").closest(".toolbar").hidden=true;$("view").hidden=true;
 $("summary").innerHTML='<a class="toolbar-link" href="?">Tilbake til én tavle</a>';
 const selected=new Set(selectedRouteIds()),labels={bus:"Buss",tram:"Trikk",metro:"T-bane"};
 $("routePicker").hidden=false;
 $("quickPicks").innerHTML=['all',...new Set(profiles.map(p=>p.line.mode))].map(mode=>'<button data-mode="'+esc(mode)+'">'+(labels[mode]||"Alle")+'</button>').join("");
 $("quickPicks").querySelectorAll("button").forEach(button=>button.onclick=()=>setMultiRoutes(profiles.filter(p=>button.dataset.mode==="all"||p.line.mode===button.dataset.mode).map(p=>p.id)));
 $("routeChecks").innerHTML=profiles.map(p=>'<label class="route-check"><input type="checkbox" value="'+esc(p.id)+'" '+(selected.has(p.id)?'checked':'')+'>'+esc(p.name)+' · '+esc(labels[p.line.mode]||p.line.mode)+'</label>').join("");
 $("routeChecks").querySelectorAll("input").forEach(input=>input.onchange=()=>setMultiRoutes([...$("routeChecks").querySelectorAll("input:checked")].map(x=>x.value)));
 const chosen=profiles.filter(p=>selected.has(p.id));
 $("status").textContent=chosen.length?"Viser "+chosen.length+" valgte ruter samtidig":"Ingen ruter er valgt";
 $("multiView").hidden=false;
 $("multiView").innerHTML=chosen.map(p=>'<article class="multi-panel"><h2>'+esc(p.name)+' <a href="?route='+encodeURIComponent(p.id)+'">Åpne separat</a></h2><iframe title="'+esc(p.name)+'" src="?route='+encodeURIComponent(p.id)+'&embedded=1"></iframe></article>').join("")||'<div class="empty">Velg én eller flere ruter ovenfor.</div>';
}
Promise.all([Promise.all(boardIds.map(id=>json("../../config/boards/"+id+".json"))),json("../../config/routes/routes.json").then(registry=>Promise.all(registry.routes.filter(r=>r.enabled).map(r=>json("../../config/routes/"+r.profile))))]).then(([values,routes])=>{
 profiles=routes.filter(p=>values.some(b=>b.routes.includes(p.id)));
 boards=values;$("profile").innerHTML=boards.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.name)+'</option>').join("");
 const requested=boards.find(b=>b.id===params.get("board"))||boards.find(b=>b.routes.includes(params.get("route")));
 if(requested)$("profile").value=requested.id;
 $("profile").onchange=()=>{selectedRoute=null;select()};$("refresh").onclick=refresh;
 $("showAll").onclick=()=>{location.search="?multi=1"};
 if(params.get("multi")==="1")renderMulti();else select();
}).catch(e=>$("status").textContent=e.message);
document.addEventListener("visibilitychange",()=>{clearTimeout(timer);if(!document.hidden)refresh()});
setInterval(()=>{if(client&&!document.hidden)paint(client.snapshot())},1000);
</script></body></html>
