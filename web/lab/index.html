<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>TransitCore Multi-Line Lab v2</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#303030;--muted:#999;--accent:#ffd54a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
main{max-width:760px;margin:auto} h1{font-size:23px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:12px}
select,button{font:inherit;color:#fff;background:#252525;border:1px solid #444;border-radius:8px;padding:10px}button{cursor:pointer}button:hover{border-color:#777}
#status{font-size:12px;color:#bbb;margin:10px 3px;min-height:18px}.ok{color:#9fdaa9!important}.error{color:#ff8585!important}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:#222;border:1px solid #333;border-radius:999px;padding:5px 9px;font-size:12px;color:#ccc}
.route,.cards{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stop{display:grid;grid-template-columns:1fr 44px;min-height:34px;align-items:center}.stop-name{text-align:right;padding-right:14px;font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;background:#3b3b3b;margin:auto}.segment{height:18px;border-left:2px solid #353535;margin-left:calc(100% - 23px)}
.card{border:1px solid #333;border-radius:10px;padding:12px;margin:8px 0;background:#202020}.card-head{display:flex;justify-content:space-between;gap:10px}.vehicle{font-weight:700}.dest{color:#ddd}
.meta{font-size:12px;color:#aaa;margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}.empty{text-align:center;color:#888;padding:30px 10px}
.live-route{position:relative;min-height:820px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 76px 24px 14px}.live-line{position:absolute;right:49px;top:34px;bottom:34px;width:4px;border-radius:4px;background:#3a3a3a}.live-stop{position:absolute;left:14px;right:42px;transform:translateY(-50%);display:grid;grid-template-columns:1fr 18px;align-items:center}.live-stop-name{text-align:right;padding-right:12px;font-size:12px;color:#ccc}.live-stop-dot{width:9px;height:9px;border-radius:50%;background:#777;margin:auto}.bus{position:absolute;right:20px;transform:translateY(-50%);width:58px;min-height:26px;border-radius:7px;padding:4px 5px;color:#101010;font-size:10px;font-weight:800;text-align:center;box-shadow:0 0 13px #0008;z-index:3}.bus small{display:block;font-size:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.offroute{opacity:.42}
.note{font-size:12px;color:#929292;line-height:1.45;margin-top:12px;padding:0 3px}
@media(max-width:520px){body{padding:10px}.toolbar{grid-template-columns:1fr}.toolbar button{width:100%}}
</style>
</head>
<body><main>
<h1>TransitCore Multi-Line Lab</h1>
<div class="sub">Route Profile v1 · samme live-motor, flere linjer</div>
<div class="toolbar"><select id="profile"></select><button id="refresh">Oppdater nå</button></div>
<div id="status">Laster profiler…</div><div id="summary" class="summary"></div><section id="view"></section>
<p class="note">Buss 3 bruker Enturs autoritative GTFS-rute mellom Loholtbakken og Hallset. Kjøretøy projiseres på traseen; svake markører ligger mer enn 150 meter fra valgt rutelinje.</p>
</main>
<script>
"use strict";
const PROFILE_FILES=["../../config/routes/atb-line-9-grakallbanen.json","../../config/routes/atb-bus-3-live.json"];
const REFRESH_MS=10000,ARRIVAL_RADIUS_M=65;let profiles=[],active=null,timer=null;
const $=id=>document.getElementById(id);const rad=v=>v*Math.PI/180;
function distance(a,b){const R=6371000,p1=rad(a.lat),p2=rad(b.lat),dp=rad(b.lat-a.lat),dl=rad(b.lon-a.lon),x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function projectToShape(point){const shape=active.shape||[],lengths=[0];for(let i=1;i<shape.length;i++)lengths[i]=lengths[i-1]+distance(shape[i-1],shape[i]);let best={distance:Infinity,along:0};for(let i=0;i<shape.length-1;i++){const a=shape[i],b=shape[i+1],lat0=rad(point.lat),sx=111320*Math.cos(lat0),sy=110540,px=point.lon*sx,py=point.lat*sy,ax=a.lon*sx,ay=a.lat*sy,bx=b.lon*sx,by=b.lat*sy,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy));if(d<best.distance)best={distance:d,along:lengths[i]+t*(lengths[i+1]-lengths[i])}}return {...best,fraction:lengths.at(-1)?best.along/lengths.at(-1):0}}
function freshness(v){const t=Date.parse(v.lastUpdated||"");return Number.isFinite(t)?t:0}
function dedupe(items){const m=new Map;for(const v of items){const old=m.get(v.id);if(!old||freshness(v)>freshness(old))m.set(v.id,v)}return [...m.values()]}
function direction(v){const d=(v.destination||"").toLowerCase();for(const x of active.directions||[])if(x.destinationMatches.some(s=>d.includes(s.toLowerCase())))return x;return {id:"unknown",label:v.destination?`mot ${v.destination}`:"ukjent retning",color:"#e45cff"}}
async function loadProfiles(){profiles=await Promise.all(PROFILE_FILES.map(async u=>{const r=await fetch(u);if(!r.ok)throw Error(`Profil ${u}: HTTP ${r.status}`);return r.json()}));const s=$("profile");s.innerHTML=profiles.map((p,i)=>`<option value="${i}">${p.name} · linje ${p.line.publicCode}</option>`).join("");s.onchange=()=>selectProfile(Number(s.value));$("refresh").onclick=refresh;selectProfile(0)}
function selectProfile(i){active=profiles[i];clearTimeout(timer);renderShell();refresh()}
function renderShell(){$("summary").innerHTML=`<span class="pill">${active.line.mode}</span><span class="pill">linje ${active.line.publicCode}</span><span class="pill">${active.provider.codespaceId}</span><span class="pill">${active.display.layout}</span>`;if(active.display.layout==="route-leds"){$("view").className="route";$("view").innerHTML=active.stops.map((s,i)=>`<div class="stop"><div class="stop-name">${s.name}</div><div class="dot" id="stop-${i}"></div></div>${i<active.stops.length-1?'<div class="segment"></div>':''}`).join("")}else if(active.display.layout==="route-live"){$("view").className="live-route";$("view").innerHTML='<div class="live-line"></div>'+active.stops.map((s,i)=>{const total=active.stops.at(-1).shapeDistanceMeters||1,p=4+92*s.shapeDistanceMeters/total;return `<div class="live-stop" style="top:${p}%"><div class="live-stop-name">${s.name}</div><div class="live-stop-dot"></div></div>`}).join("")}else{$("view").className="cards";$("view").innerHTML='<div class="empty">Henter aktive kjøretøy…</div>'}}
async function fetchVehicles(){const query=`{ vehicles(codespaceId:"${active.provider.codespaceId}"){ vehicleId lastUpdated destinationName line{publicCode} location{latitude longitude} } }`;const r=await fetch(active.provider.vehicleEndpoint,{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":"lgb-transitcore-multiline-lab"},body:JSON.stringify({query})});if(!r.ok)throw Error(`Entur HTTP ${r.status}`);const j=await r.json();if(j.errors?.length)throw Error(j.errors[0].message||"GraphQL-feil");return dedupe((j.data?.vehicles||[]).filter(v=>String(v?.line?.publicCode||"")===active.line.publicCode&&v?.location?.latitude!=null&&v?.location?.longitude!=null).map(v=>({id:String(v.vehicleId),lastUpdated:v.lastUpdated||"",destination:v.destinationName||"",lat:Number(v.location.latitude),lon:Number(v.location.longitude)})).filter(v=>Number.isFinite(v.lat)&&Number.isFinite(v.lon)&&v.lat>=58&&v.lat<=72&&v.lon>=4&&v.lon<=32))}
function renderRoute(vs){document.querySelectorAll(".dot").forEach(x=>{x.style.background="#3b3b3b";x.style.boxShadow="none"});for(const v of vs){let best=-1,dist=Infinity;active.stops.forEach((s,i)=>{const d=distance(v,s);if(d<dist){dist=d;best=i}});if(best>=0&&dist<=ARRIVAL_RADIUS_M){const x=$(`stop-${best}`),dir=direction(v);x.style.background=dir.color;x.style.boxShadow=`0 0 6px ${dir.color},0 0 16px ${dir.color}`}}}
function renderLiveRoute(vs){document.querySelectorAll(".bus").forEach(x=>x.remove());for(const v of vs){const p=projectToShape(v),d=direction(v),top=4+92*p.fraction,el=document.createElement("div");el.className=`bus${p.distance>150?' offroute':''}`;el.style.top=`${top}%`;el.style.background=d.color;el.title=`Kjøretøy ${v.id} · ${d.label} · ${Math.round(p.distance)} m fra traseen`;el.innerHTML=`${v.id}<small>${d.label}</small>`;$("view").appendChild(el)}}
function renderCards(vs){if(!vs.length){$("view").innerHTML='<div class="empty">Ingen aktive kjøretøy funnet akkurat nå.</div>';return}$("view").innerHTML=vs.sort((a,b)=>a.destination.localeCompare(b.destination)).map(v=>{const d=direction(v),age=Math.max(0,Math.round((Date.now()-freshness(v))/1000));return `<article class="card"><div class="card-head"><span class="vehicle">Kjøretøy ${v.id}</span><span class="dest" style="color:${d.color}">${d.label}</span></div><div class="meta"><span>${v.lat.toFixed(5)}, ${v.lon.toFixed(5)}</span><span>oppdatert for ${age} s siden</span></div></article>`}).join("")}
async function refresh(){clearTimeout(timer);$("status").className="";$("status").textContent=`Henter ${active.name}…`;try{const vs=await fetchVehicles();active.display.layout==="route-leds"?renderRoute(vs):active.display.layout==="route-live"?renderLiveRoute(vs):renderCards(vs);$("status").className="ok";$("status").textContent=`${vs.length} aktive kjøretøy · ${new Date().toLocaleTimeString()}`}catch(e){console.error(e);$("status").className="error";$("status").textContent=`Kunne ikke hente live-data: ${e.message}`}finally{timer=setTimeout(refresh,REFRESH_MS)}}
loadProfiles().catch(e=>{$("status").className="error";$("status").textContent=e.message});
</script></body></html>
