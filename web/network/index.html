<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TransitCore nettverkskart</title>
  <link rel="stylesheet" href="../shared/signal-policy.css">
  <style>
    :root{color-scheme:dark;--bg:#090d12;--panel:#121821;--line:#35404d;--text:#f5f7fa;--muted:#9ca9b8;--ok:#39d98a;--warn:#ffb020}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:16px}
    h1{font-size:26px;margin:0}.sub{color:var(--muted);margin:5px 0 12px}.tools,.legend,.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
    button,.toggle{background:#18212c;color:var(--text);border:1px solid #3b4858;border-radius:9px;padding:8px 11px;cursor:pointer;font:inherit}.toggle input{margin-right:6px}.status{margin-left:auto;color:var(--muted)}
    .badge{border:1px solid #2b3542;background:#121821;border-radius:999px;padding:6px 10px}.badge b{color:#fff}.swatch{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
    .mapwrap{background:#0e141c;border:1px solid #26303d;border-radius:14px;overflow:hidden;position:relative}svg{display:block;width:100%;height:auto;min-height:560px}
    .route{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.82}.route.off{display:none}.station{cursor:pointer}.station-core{fill:#202a36;stroke:#657386;stroke-width:3;transition:opacity .2s}.station-core.on{fill:currentColor;stroke:#fff;filter:url(#glow)}.station-core.approaching{animation:transitCoreApproachPulse var(--tc-approach-pulse) ease-in-out infinite;transform-box:fill-box;transform-origin:center}.station-core.departed{fill:currentColor;stroke:currentColor;opacity:.24}.station-core.hidden-route{display:none}\n    .station-label{fill:#dce4ee;font-size:12px;font-weight:700;paint-order:stroke;stroke:#0e141c;stroke-width:5px;stroke-linejoin:round;pointer-events:none}.station-label.minor{font-size:10px;opacity:0;transition:opacity .15s}.station:hover .station-label.minor,.station:focus .station-label.minor{opacity:1}
    .info{display:none;position:absolute;left:12px;bottom:12px;width:min(420px,calc(100% - 24px));background:#17202b;border:1px solid #48576a;border-radius:12px;padding:12px;box-shadow:0 15px 40px #000a}.info.show{display:block}.info h2{font-size:16px;margin:0 0 7px}.info p{margin:5px 0;color:#ccd5df}.close{float:right;padding:4px 8px}
    @media(max-width:650px){main{padding:9px}.status{width:100%;margin:0}svg{min-height:440px}.station-label{font-size:9px}.station-label.minor{display:none}.route{stroke-width:11}}
  </style>
</head>
<body><main>
  <h1>&#128652; TransitCore nettverkskart</h1>
  <p class="sub">Linje 1, 2 og 3 samlet som et skjematisk metro-kart</p>
  <div class="tools" id="filters"></div>
  <div class="tools"><button id="refresh">Oppdater live</button><button id="simulate">Simuler tre linjer på samme LED</button><span class="status" id="status">Starter ...</span></div>
  <div class="stats"><span class="badge">Aktive stasjoner <b id="activeCount">-</b></span><span class="badge">Busser <b id="vehicleCount">-</b></span><span class="badge">Flerlinjestasjoner <b id="collisionCount">-</b></span><span class="badge">Frame <b id="quality">-</b></span></div>
  <div class="legend" id="legend"></div>
  <section class="mapwrap">
    <svg id="map" viewBox="0 0 1200 920" role="img" aria-labelledby="mapTitle mapDesc"><title id="mapTitle">Trondheim busslinje 1, 2 og 3</title><desc id="mapDesc">Skjematisk nettverkskart med live LED-signaler og forgreninger.</desc><defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="routes"></g><g id="stations"></g></svg>
    <aside class="info" id="info"><button class="close" id="close">Lukk</button><h2 id="infoTitle"></h2><div id="infoBody"></div></aside>
  </section>
</main>
<script src="../shared/board-client-model.js"></script><script src="../shared/canonical-frame-client.js"></script><script src="../shared/signal-policy.js"></script><script>
TransitCoreSignals.applyCssVariables(document);
"use strict";
const $=id=>document.getElementById(id),BASE="../../config/",FEED="https://transitcore-led-feed.lgb84.workers.dev/v1/boards/trondheim-bus-board/frame";
let client,board,hardware,profiles=[],stationMap=new Map,physicalByLogical=new Map,physicalStation=new Map,lastFrame=null,timer=null,cycleTimer=null,simulation=false;
const svgNS="http://www.w3.org/2000/svg";
async function json(url){const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);return response.json()}
function esc(value){return String(value??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function routeColor(profile){return profile.line.color||profile.directions[0]?.color||"#60a5fa"}
function selectedRoutes(){return new Set([...document.querySelectorAll("[data-route-filter]:checked")].map(input=>input.value))}
function orderedStations(profile){
  const nodes=board.nodes.filter(node=>node.routes.includes(profile.id)),byStop=new Map;
  nodes.forEach(node=>(node.stopIds||[]).forEach(id=>byStop.set(id,node)));
  const result=[],seen=new Set;
  for(const stop of profile.stops){
    const nearest=nodes.reduce((best,node)=>{const d=Math.hypot(node.lat-stop.lat,node.lon-stop.lon);return !best||d<best.d?{node,d}:best},null)?.node;
    const match=byStop.get(stop.id)||nearest;
    if(match&&!seen.has(match.stationId)){seen.add(match.stationId);result.push(match.stationId)}
  }
  return result;
}
function projectStations(){
  stationMap=new Map;
  for(const node of board.nodes){
    const station=stationMap.get(node.stationId)||{id:node.stationId,name:node.name,nodes:[],routes:new Set,lat:0,lon:0};
    station.nodes.push(node);node.routes.forEach(route=>station.routes.add(route));station.lat+=Number(node.lat);station.lon+=Number(node.lon);stationMap.set(node.stationId,station);
  }
  const stations=[...stationMap.values()];stations.forEach(station=>{station.lat/=station.nodes.length;station.lon/=station.nodes.length});
  const meanLat=stations.reduce((sum,s)=>sum+s.lat,0)/stations.length,cos=Math.cos(meanLat*Math.PI/180);
  const xs=stations.map(s=>s.lon*cos),ys=stations.map(s=>s.lat),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  stations.forEach(station=>{station.x=90+Math.round(((station.lon*cos-minX)/(maxX-minX||1))*1020/10)*10;station.y=80+Math.round(((maxY-station.lat)/(maxY-minY||1))*760/10)*10});
}
function el(name,attrs={}){const node=document.createElementNS(svgNS,name);for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);return node}
function schematicPath(ids,index){
  const points=ids.map(id=>stationMap.get(id)).filter(Boolean),offset=(index-1)*7;
  if(!points.length)return "";
  let d="M "+(points[0].x+offset)+" "+(points[0].y+offset);
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i],ax=a.x+offset,ay=a.y+offset,bx=b.x+offset,by=b.y+offset,dx=bx-ax,dy=by-ay;
    if(Math.abs(dx)>=Math.abs(dy)){const mx=ax+Math.sign(dx||1)*Math.abs(dy);d+=" L "+mx+" "+by+" L "+bx+" "+by}
    else{const my=ay+Math.sign(dy||1)*Math.abs(dx);d+=" L "+bx+" "+my+" L "+bx+" "+by}
  }
  return d;
}
function buildMap(){
  projectStations();physicalByLogical=new Map(hardware.assignments.map(item=>[item.logicalLed,item.physicalLed]));physicalStation=new Map;
  $("routes").innerHTML="";$("stations").innerHTML="";
  const orderedByRoute=new Map,major=new Set;
  profiles.forEach((profile,index)=>{
    const ids=orderedStations(profile);orderedByRoute.set(profile.id,ids);if(ids.length){major.add(ids[0]);major.add(ids[ids.length-1])}
    const path=el("path",{d:schematicPath(ids,index),class:"route","data-route":profile.id,stroke:routeColor(profile)});$("routes").append(path);
  });
  for(const station of stationMap.values()){
    if(station.routes.size>1)major.add(station.id);
    station.nodes.forEach(node=>physicalStation.set(String(physicalByLogical.get(node.led)),station.id));
  }
  for(const station of stationMap.values()){
    const group=el("g",{class:"station",tabindex:"0","data-station":station.id,"data-name":station.name,"data-routes":[...station.routes].join(","),"data-leds":station.nodes.map(node=>physicalByLogical.get(node.led)).join(",")});
    station.nodes.forEach((node,index)=>group.append(el("circle",{cx:station.x+(index-(station.nodes.length-1)/2)*10,cy:station.y,r:4.5,class:"station-core","data-led":physicalByLogical.get(node.led)})));
    const label=el("text",{x:station.x+14,y:station.y-12,class:"station-label"+(major.has(station.id)?"":" minor")});label.textContent=station.name;group.append(label);
    group.addEventListener("click",()=>showStationInfo(group));group.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();showStationInfo(group)}});
    $("stations").append(group);
  }
  applyFilters();
}
function applyFilters(){
  const selected=selectedRoutes();
  document.querySelectorAll(".route").forEach(path=>path.classList.toggle("off",!selected.has(path.dataset.route)));
  document.querySelectorAll(".led").forEach(led=>{const routes=(led.dataset.routes||"").split(",");led.classList.toggle("hidden-route",!routes.some(route=>selected.has(route)))});
  document.querySelectorAll("[data-station]").forEach(group=>{const routes=(group.dataset.routes||"").split(",");group.style.display=routes.some(route=>selected.has(route))?"":"none"});
}

function paint(frame){
 lastFrame=frame;const byId=new Map((frame.leds||[]).map(l=>[String(l.id),l]));
 document.querySelectorAll(".station-core").forEach(core=>{
  const item=byId.get(core.dataset.led);core.classList.remove("on","approaching","departed");
  core.dataset.state=item?.lifecycle||item?.state||"OFF";
  if(!item)return;
  core.style.color="rgb("+item.rgb.join(",")+")";
  core.classList.add(core.dataset.state==="PASSED"?"departed":"on");
  if(core.dataset.state==="APPROACHING")core.classList.add("approaching");
 });
 $("activeCount").textContent=new Set((frame.leds||[]).map(l=>physicalStation.get(String(l.id)))).size;
 $("vehicleCount").textContent=(frame.leds||[]).reduce((s,l)=>s+(l.occupants?.length||1),0);
 $("collisionCount").textContent=(frame.leds||[]).filter(l=>new Set((l.occupants||[]).map(v=>v.line)).size>1).length;
 $("quality").textContent=simulation?"SIMULERING":client?.snapshot().sample.status||"NO_FRAME";
 $("status").textContent=(simulation?"SIMULERING":client?.snapshot().algorithm)+" · "+frame.boardProfile+" · frame "+frame.sequence+" · "+frame.generatedAt;
}
function showStationInfo(group){
 const ids=new Set(group.dataset.leds.split(","));
 $("infoTitle").textContent=group.dataset.name;
 $("infoBody").innerHTML=(lastFrame?.leds||[]).filter(l=>ids.has(String(l.id))).map(l=>"<p>LED "+l.id+" · "+esc(l.lifecycle||l.state)+" · kjøretøy "+esc(l.vehicle?.id||"Ikke rapportert")+"</p>").join("")||"<p>Ingen aktive LED-er.</p>";
 $("info").classList.add("show");
}
async function refresh(){
 clearTimeout(timer);if(document.hidden||simulation)return;
 client ||= TransitCoreFrames.create({boardId:board.id,ledCount:hardware.leds.count});
 const result=await client.refresh();if(result.frame)paint(result.frame);else $("status").textContent=result.sample.status;
 timer=setTimeout(refresh,10000);
}
function simulate(){
 simulation=true;clearTimeout(timer);
 const id=hardware.assignments[0].physicalLed,occupants=profiles.slice(0,3).map(p=>({id:"SIM-"+p.id,line:p.line.publicCode,rgb:hexRgb(routeColor(p)),state:"AT_STOP"}));
 paint({schemaVersion:1,boardProfile:board.id,generatedAt:new Date().toISOString(),sequence:1,ttlSeconds:30,ledCount:hardware.leds.count,leds:[{id,state:"AT_STOP",rgb:occupants[0].rgb,brightness:32,vehicle:occupants[0],occupants}]});
}
document.addEventListener("visibilitychange",()=>{clearTimeout(timer);if(!document.hidden&&!simulation)refresh()});
setInterval(()=>{if(client&&!simulation&&!document.hidden){const result=client.snapshot();if(result.frame)paint(result.frame)}},1000);
function hexRgb(hex){const value=hex.replace("#","");return [0,2,4].map(i=>parseInt(value.slice(i,i+2),16))}
$("refresh").onclick=()=>{simulation=false;$("simulate").textContent="Simuler tre linjer på samme LED";refresh()};$("simulate").onclick=simulate;$("close").onclick=()=>$("info").classList.remove("show");
Promise.all([json(BASE+"boards/trondheim-bus-board.json"),json(BASE+"hardware/trondheim-bus-board-hardware.json")]).then(async values=>{[board,hardware]=values;profiles=await Promise.all(board.routes.map(id=>json(BASE+"routes/"+id+".json")));$("filters").innerHTML=profiles.map(profile=>'<label class="toggle"><input type="checkbox" data-route-filter value="'+esc(profile.id)+'" checked><i class="swatch" style="background:'+esc(routeColor(profile))+'"></i>Linje '+esc(profile.line.publicCode)+'</label>').join("");$("legend").innerHTML=profiles.map(profile=>'<span><i class="swatch" style="background:'+esc(routeColor(profile))+'"></i>Linje '+esc(profile.line.publicCode)+'</span>').join("");document.querySelectorAll("[data-route-filter]").forEach(input=>input.onchange=applyFilters);buildMap();refresh()}).catch(error=>$("status").textContent=error.message);
</script>
</body>
</html>
