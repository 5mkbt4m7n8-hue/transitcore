<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TransitCore lineÃ¦r tavlesimulator</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e12;--panel:#12161c;--line:#343b45;--text:#f5f7fa;--muted:#98a3b2;--ok:#39d98a;--warn:#ffb020;--bad:#ff5c5c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:820px;margin:auto;padding:18px}
    h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:6px 0 14px}.tools,.summary,.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
    select,button{font:inherit;color:var(--text);background:#1b222c;border:1px solid #3b4654;border-radius:9px;padding:9px 12px}button{cursor:pointer}.status{margin-left:auto;color:var(--muted)}
    .badge{background:#171d25;border:1px solid #2c3541;border-radius:999px;padding:6px 10px}.badge b{color:#fff}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
    .board{border:1px solid #252b34;background:var(--panel);border-radius:12px;padding:12px 8px 18px;overflow:hidden}.head,.row{display:grid;grid-template-columns:minmax(130px,1fr) 94px 94px;align-items:center}
    .head{position:sticky;top:0;z-index:4;background:var(--panel);padding:9px 0;color:var(--muted);font-size:12px}.head span{text-align:center}.station{text-align:right;padding-right:18px;font-weight:600}
    .cell{height:42px;position:relative;display:grid;place-items:center}.cell:before{content:"";position:absolute;inset:0 auto 0 50%;width:4px;transform:translateX(-50%);background:var(--line)}.row.first .cell:before{top:50%}.row.last .cell:before{bottom:50%}
    .led{position:relative;z-index:2;width:16px;height:16px;border-radius:50%;background:#30363e;border:2px solid #505966;cursor:pointer}.led.on{background:currentColor;border-color:#fff;box-shadow:0 0 10px 3px currentColor}.led.approaching{opacity:.7}.led.empty{opacity:.14;cursor:default}
    .ledno{position:absolute;left:22px;top:-3px;color:#778292;font:10px ui-monospace,monospace;white-space:nowrap}.info{display:none;position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(94vw,520px);background:#18202a;border:1px solid #465467;border-radius:13px;padding:14px;box-shadow:0 18px 50px #000b}.info.show{display:block}.info h2{font-size:17px;margin:0 0 8px}.info p{margin:5px 0;color:#c8d1dc}.info strong{color:#fff}.close{float:right;padding:4px 8px}
    @media(max-width:560px){main{padding:10px}.head,.row{grid-template-columns:minmax(105px,1fr) 72px 72px}.station{font-size:12px;padding-right:9px}.ledno{display:none}.status{width:100%;margin-left:0}}
  </style>
</head>
<body><main>
  <h1>ðŸšŒ TransitCore Live</h1><p class="sub">Samme LED-frame som sendes til den fysiske tavlen</p>
  <div class="tools"><label>Linje <select id="route"></select></label><button id="refresh">Oppdater</button><button id="test">LED-test</button><span class="status" id="status">Starter â€¦</span></div>
  <div class="summary"><span class="badge">Holdeplasser <b id="stationCount">â€“</b></span><span class="badge">Aktive LED-er <b id="activeCount">â€“</b></span><span class="badge">Frame <b id="quality">â€“</b></span></div>
  <div class="legend" id="legend"></div>
  <section class="board"><div class="head"><b>Holdeplass</b><span id="dirA">Retning A</span><span id="dirB">Retning B</span></div><div id="rows"></div></section>
</main>
<aside class="info" id="info"><button class="close" id="close">Lukk</button><h2 id="infoTitle"></h2><div id="infoBody"></div></aside>
<script>
"use strict";
const $=id=>document.getElementById(id),BASE="../../config/",FEED="https://transitcore-led-feed.lgb84.workers.dev/v1/boards/trondheim-bus-board/frame";
let board,hardware,profiles=[],profile,ordered=[],timer,testing=false,lastFrame=null;
async function json(url){const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw Error(`HTTP ${response.status}`);return response.json()}
function esc(value){return String(value??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function directionId(direction){return direction.reverseShape?"1":"0"}
function stationRows(){
  const route=profile.id,nodes=board.nodes.filter(node=>node.routes.includes(route)),byStop=new Map;
  nodes.forEach(node=>(node.stopIds||[]).forEach(id=>byStop.set(id,node)));
  const seen=new Set;ordered=[];
  for(const stop of profile.stops){
    const nearest=nodes.reduce((best,node)=>{const d=Math.hypot(node.lat-stop.lat,node.lon-stop.lon);return !best||d<best.d?{node,d}:best},null)?.node;
    const match=byStop.get(stop.id)||nearest;if(!match||seen.has(match.stationId))continue;seen.add(match.stationId);
    const stationNodes=nodes.filter(node=>node.stationId===match.stationId),directions=profile.directions.slice(0,2);
    const pick=direction=>stationNodes.find(node=>node.routeDirections?.[route]?.directionIds?.includes(directionId(direction)));
    ordered.push({name:match.name,nodes:directions.map(pick)});
  }
  return ordered;
}
function build(){
  profile=profiles.find(item=>item.id===$("route").value)||profiles[0];const directions=profile.directions.slice(0,2),physical=new Map(hardware.assignments.map(a=>[a.logicalLed,a.physicalLed]));stationRows();
  $("dirA").textContent=directions[0]?.label||"Retning A";$("dirB").textContent=directions[1]?.label||"Retning B";
  $("legend").innerHTML=directions.map(direction=>`<span><i class="dot" style="background:${esc(direction.color)}"></i>${esc(direction.label)}</span>`).join("");
  $("rows").innerHTML=ordered.map((station,index)=>`<div class="row ${index===0?"first":""} ${index===ordered.length-1?"last":""}"><div class="station">${esc(station.name)}</div>${station.nodes.map((node,column)=>{const id=node?physical.get(node.led):"";return `<div class="cell"><i class="led ${node?"":"empty"}" data-id="${id}" data-name="${esc(station.name)}" data-direction="${esc(directions[column]?.label||"")}" style="color:${esc(directions[column]?.color||"#60a5fa")}">${node?`<small class="ledno">${id}</small>`:""}</i></div>`}).join("")}</div>`).join("");
  $("stationCount").textContent=ordered.length;document.querySelectorAll(".led:not(.empty)").forEach(led=>led.onclick=()=>showInfo(led));if(lastFrame)paint(lastFrame);
}
function paint(frame){
  lastFrame=frame;document.querySelectorAll(".led").forEach(led=>{led.classList.remove("on","approaching");delete led.dataset.state;delete led.dataset.vehicle});
  for(const item of frame.leds||[]){for(const led of document.querySelectorAll(`.led[data-id="${item.id}"]`)){led.style.color=`rgb(${item.rgb.join(",")})`;led.classList.add("on");if(item.state==="APPROACHING")led.classList.add("approaching");led.dataset.state=item.state;led.dataset.vehicle=JSON.stringify(item.vehicle||{})}}
  const age=Math.max(0,Math.floor((Date.now()-Date.parse(frame.generatedAt))/1000)),fresh=age<=Number(frame.ttlSeconds||30);$("activeCount").textContent=(frame.leds||[]).length;$("quality").textContent=fresh?`LIVE Â· ${age} s`:`UTDATERT Â· ${age} s`;$("quality").style.color=fresh?"var(--ok)":"var(--bad)";$("status").textContent=`Oppdatert ${new Date().toLocaleTimeString()}`;
}
function showInfo(led){
  const item=(lastFrame?.leds||[]).find(value=>String(value.id)===led.dataset.id),vehicle=item?.vehicle||{};$("infoTitle").textContent=`${led.dataset.name} Â· LED ${led.dataset.id}`;
  $("infoBody").innerHTML=`<p><strong>Retning:</strong> ${esc(led.dataset.direction)}</p><p><strong>Tilstand:</strong> ${esc(item?.state||"AV")}</p>${item?`<p><strong>Linje/kjÃ¸retÃ¸y:</strong> ${esc(vehicle.line||profile.line.publicCode)}${vehicle.id?` Â· ${esc(vehicle.id)}`:""}</p><p><strong>Destinasjon:</strong> ${esc(vehicle.destination||"Ikke oppgitt")}</p><p><strong>Datakvalitet:</strong> ${vehicle.ageSeconds!=null?`${esc(vehicle.ageSeconds)} s gammel posisjon`:"Live frame â€“ kjÃ¸retÃ¸ydetaljer kommer etter publisering"}</p>`:"<p>Ingen aktiv buss pÃ¥ denne dioden nÃ¥.</p>"}`;$("info").classList.add("show");
}
async function refresh(){clearTimeout(timer);if(!testing)try{paint(await json(FEED))}catch(error){$("status").textContent=`Feedfeil: ${error.message}`;$("quality").textContent="FEIL"}timer=setTimeout(refresh,10000)}
$("close").onclick=()=>$("info").classList.remove("show");$("refresh").onclick=refresh;$("route").onchange=build;
$("test").onclick=()=>{testing=!testing;$("test").textContent=testing?"Stopp test":"LED-test";if(!testing)return refresh();const leds=[...document.querySelectorAll(".led:not(.empty)")];let index=0;const step=()=>{if(!testing)return;document.querySelectorAll(".led").forEach(led=>led.classList.remove("on"));leds[index++%leds.length].classList.add("on");$("status").textContent=`LED-test ${index}/${leds.length}`;setTimeout(step,250)};step()};
Promise.all([json(`${BASE}boards/trondheim-bus-board.json`),json(`${BASE}hardware/trondheim-bus-board-hardware.json`)]).then(async values=>{[board,hardware]=values;profiles=await Promise.all(board.routes.map(id=>json(`${BASE}routes/${id}.json`)));$("route").innerHTML=profiles.map(item=>`<option value="${esc(item.id)}">${esc(item.line.publicCode)} Â· ${esc(item.name)}</option>`).join("");build();refresh()}).catch(error=>$("status").textContent=error.message);
</script></body></html>
