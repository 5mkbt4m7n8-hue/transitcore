<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitCore linje 1</title><style>:root{color-scheme:dark;--bg:#0d0f12;--panel:#15181d;--line:#2c323a;--text:#f6f7f9;--muted:#99a2af;--red:#ef5350;--green:#66bb6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}main{max-width:760px;margin:auto;padding:18px}h1{margin:0;font-size:27px}.sub{color:var(--muted);margin:7px 0 14px}.legend,.tools{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin:10px 0}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}button{font:inherit;color:var(--text);background:#202630;border:1px solid #3b4553;border-radius:8px;padding:8px 11px;cursor:pointer}.board{border:1px solid #252a31;background:#121416;padding:12px 8px 18px}.head,.row{display:grid;grid-template-columns:1fr 58px 58px;align-items:center}.head{position:sticky;top:0;z-index:4;background:#121416;padding:8px 0;color:var(--muted);font-size:12px}.head span{text-align:center}.station{text-align:right;padding-right:17px;font-weight:600}.tracks{display:contents}.cell{height:38px;position:relative;display:grid;place-items:center}.cell:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;transform:translateX(-50%);background:#343a42}.row:first-of-type .cell:before{top:50%}.row:last-child .cell:before{bottom:50%}.led{position:relative;z-index:2;width:15px;height:15px;border-radius:50%;background:#353a40;border:2px solid #4a515b}.led.on{background:currentColor;border-color:#fff;box-shadow:0 0 9px 3px currentColor}.led.approaching{opacity:.6}.led:after{content:attr(data-led);display:none;position:absolute;left:18px;top:-7px;background:#050607e8;padding:4px 6px;border-radius:5px;color:#fff;white-space:nowrap;font-size:11px}.led:hover:after{display:block}.empty{opacity:.15}.status{margin-left:auto;color:var(--muted)}@media(max-width:520px){main{padding:10px}.head,.row{grid-template-columns:1fr 48px 48px}.station{font-size:12px;padding-right:9px}}</style></head><body><main><h1>🚌 Trondheim linje 1 Live</h1><p class="sub" id="subtitle">To spor · faktisk holdeplassrekkefølge</p><div class="tools"><button id="refresh">Oppdater live</button><button id="test">Test alle LED-er</button><span class="status" id="status">Starter …</span></div><div class="legend"><span><i class="dot" style="background:var(--red)"></i>mot Kattem/Tiller</span><span><i class="dot" style="background:var(--green)"></i>mot Ranheim/Strindheim</span></div><section class="board"><div class="head"><b>Holdeplass</b><span>sørover</span><span>nordover</span></div><div id="rows"></div></section></main><script>"use strict";const $=id=>document.getElementById(id),BASE="../../config/",FEED="https://transitcore-led-feed.lgb84.workers.dev/v1/boards/trondheim-bus-board/frame",ROUTE="atb-bus-1-live";let board,profile,hardware,ordered=[],timer,testing=false;async function json(u){const r=await fetch(u);if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}function build(){const nodes=board.nodes.filter(n=>n.routes.includes(ROUTE)),byStop=new Map;nodes.forEach(n=>(n.stopIds||[]).forEach(id=>byStop.set(id,n)));const seen=new Set;ordered=[];for(const stop of profile.stops){const match=byStop.get(stop.id)||nodes.reduce((best,n)=>!best||Math.hypot(n.lat-stop.lat,n.lon-stop.lon)<best.d?{n,d:Math.hypot(n.lat-stop.lat,n.lon-stop.lon)}:best,null)?.n;if(!match||seen.has(match.stationId))continue;seen.add(match.stationId);const stationNodes=nodes.filter(n=>n.stationId===match.stationId),south=stationNodes.find(n=>n.routeDirections?.[ROUTE]?.directionIds?.includes("0")),north=stationNodes.find(n=>n.routeDirections?.[ROUTE]?.directionIds?.includes("1"));ordered.push({name:match.name,south,north})}const physical=new Map(hardware.assignments.map(a=>[a.logicalLed,a.physicalLed]));$("rows").innerHTML=ordered.map((s,i)=>`<div class="row"><div class="station">${s.name}</div>${[s.south,s.north].map((n,j)=>`<div class="cell"><i class="led ${n?"":"empty"}" data-id="${n?physical.get(n.led):""}" data-led="${n?`LED ${physical.get(n.led)} · ${n.name}`:"Ingen holdeplass i denne retningen"}" style="color:${j?"var(--green)":"var(--red)"}"></i></div>`).join("")}</div>`).join("");$("subtitle").textContent=`${ordered.length} holdeplasser · to parallelle spor · fysisk LED-mapping`}function paint(frame){document.querySelectorAll(".led").forEach(e=>e.classList.remove("on","approaching"));for(const l of frame.leds||[]){const e=document.querySelector(`.led[data-id="${l.id}"]`);if(!e)continue;e.style.color=`rgb(${l.rgb.join(",")})`;e.classList.add("on");if(l.state==="APPROACHING")e.classList.add("approaching")}$("status").textContent=`${[...document.querySelectorAll(".led.on")].length} aktive · ${new Date().toLocaleTimeString()}`}async function refresh(){clearTimeout(timer);if(!testing)try{paint(await json(FEED))}catch(e){$("status").textContent=`Feedfeil: ${e.message}`}timer=setTimeout(refresh,10000)}$("refresh").onclick=refresh;$("test").onclick=()=>{testing=!testing;$("test").textContent=testing?"Stopp test":"Test alle LED-er";if(!testing)return refresh();const leds=[...document.querySelectorAll(".led:not(.empty)")];let i=0;const step=()=>{if(!testing)return;document.querySelectorAll(".led").forEach(e=>e.classList.remove("on"));leds[i++%leds.length].classList.add("on");$("status").textContent=`LED-test ${i}/${leds.length}`;setTimeout(step,250)};step()};Promise.all([json(`${BASE}boards/trondheim-bus-board.json`),json(`${BASE}routes/${ROUTE}.json`),json(`${BASE}hardware/trondheim-bus-board-hardware.json`)]).then(v=>{[board,profile,hardware]=v;build();refresh()}).catch(e=>$("status").textContent=e.message);</script></body></html>
