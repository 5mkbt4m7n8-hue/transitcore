<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitCore karttavle</title>
<style>:root{color-scheme:dark;--bg:#0b0d11;--panel:#151922;--line:#344054;--text:#f4f7fb;--muted:#9aa5b5;--blue:#42a5f5;--green:#66bb6a;--yellow:#ffca28;--red:#ef5350}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line)}h1{margin:0 0 10px;font-size:22px}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select,label.action{background:#222b3b;color:var(--text);border:1px solid #46536a;border-radius:8px;padding:9px 11px;font:inherit;cursor:pointer}button.active{background:#1d4f7d}input[type=file]{display:none}#status{color:var(--muted);margin-left:auto}.stage-wrap{padding:12px;overflow:auto}.stage{position:relative;width:min(1600px,100%);aspect-ratio:1.18;margin:auto;background:#edf0ed center/contain no-repeat;border:8px solid #5b321e;border-radius:16px;overflow:hidden;touch-action:none}.route{position:absolute;height:5px;transform-origin:0 50%;background:#546170;opacity:.55;pointer-events:none}.led{position:absolute;width:17px;height:17px;border:3px solid #536174;border-radius:50%;background:#17202d;transform:translate(-50%,-50%);cursor:grab;z-index:2}.led.on{border-color:#fff;box-shadow:0 0 9px 4px currentColor;background:currentColor}.led.approaching{opacity:.65}.led.selected{outline:3px solid #fff;outline-offset:3px}.led span{display:none;position:absolute;left:12px;top:12px;white-space:nowrap;background:#10141be8;padding:4px 6px;border-radius:5px;color:#fff;font-size:11px}.led:hover span,.led.selected span{display:block}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px;color:var(--muted)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}@media(max-width:700px){#status{width:100%;margin:0}.stage{min-width:700px}}</style></head>
<body><header><h1>TransitCore karttavle</h1><div class="tools"><select id="board"><option value="trondheim-bus-board">Trondheim buss · linje 1, 2 og 3</option><option value="oslo-metro-wizard-separate">Oslo T-bane · linje 1</option></select><label class="action">Velg kartbilde<input id="image" type="file" accept="image/*"></label><button id="edit">Flytt LED-er</button><button id="auto">Automatisk plassering</button><button id="save">Lagre lokalt</button><button id="export">Last ned kartlayout</button><button id="test">Test LED-er</button><span id="status">Starter …</span></div></header><div class="stage-wrap"><div id="stage" class="stage"></div></div><div class="legend"><span><i class="dot" style="background:var(--red)"></i>Linje 1</span><span><i class="dot" style="background:var(--blue)"></i>Linje 2</span><span><i class="dot" style="background:var(--green)"></i>Linje 3</span><span>Svakt lys = nærmer seg · sterkt lys = ved holdeplass</span></div>
<script>"use strict";const $=id=>document.getElementById(id),BASE="../../config/",FEED="https://transitcore-led-feed.lgb84.workers.dev/v1/boards/";let board,hardware,layout={},editing=false,testing=false,timer,drag=null;const colors={1:"#ef5350",2:"#42a5f5",3:"#66bb6a",4:"#ab47bc",5:"#ffa726"};async function json(url){const r=await fetch(url);if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}function key(){return`transitcore-map-${board.id}`}function pos(n){return layout[n.id]||{x:50,y:50}}function draw(){const s=$("stage");s.innerHTML="";const ordered=[...hardware.assignments].sort((a,b)=>a.physicalLed-b.physicalLed),byId=new Map(board.nodes.map(n=>[n.id,n]));for(let i=1;i<ordered.length;i++){const a=pos(byId.get(ordered[i-1].sourceNodeId)),b=pos(byId.get(ordered[i].sourceNodeId)),dx=b.x-a.x,dy=b.y-a.y,line=document.createElement("i");line.className="route";line.style.cssText=`left:${a.x}%;top:${a.y}%;width:${Math.hypot(dx,dy)}%;transform:rotate(${Math.atan2(dy,dx)}rad)`;s.append(line)}for(const a of ordered){const n=byId.get(a.sourceNodeId),p=pos(n),el=document.createElement("button");el.className="led";el.dataset.id=n.id;el.dataset.physical=a.physicalLed;el.style.left=p.x+"%";el.style.top=p.y+"%";el.innerHTML=`<span>LED ${a.physicalLed} · ${n.name} · ${a.direction||n.directionSide||"felles"}</span>`;el.onpointerdown=e=>{if(!editing)return;drag={id:n.id,el};el.setPointerCapture(e.pointerId);e.preventDefault()};el.onpointermove=e=>{if(!drag||drag.el!==el)return;const r=s.getBoundingClientRect();layout[n.id]={x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))};el.style.left=layout[n.id].x+"%";el.style.top=layout[n.id].y+"%"};el.onpointerup=()=>{drag=null;draw()};s.append(el)}}function autoPlace(){const nodes=board.nodes,lat=nodes.map(n=>n.lat).filter(Number.isFinite),lon=nodes.map(n=>n.lon).filter(Number.isFinite),minLat=Math.min(...lat),maxLat=Math.max(...lat),minLon=Math.min(...lon),maxLon=Math.max(...lon);nodes.forEach((n,i)=>layout[n.id]=Number.isFinite(n.lat)?{x:7+86*(n.lon-minLon)/(maxLon-minLon||1),y:7+86*(maxLat-n.lat)/(maxLat-minLat||1)}:{x:10+80*(i%12)/11,y:10+80*Math.floor(i/12)/Math.ceil(nodes.length/12)});draw()}function paint(frame){document.querySelectorAll(".led").forEach(e=>e.classList.remove("on","approaching"));for(const led of frame.leds||[]){const e=document.querySelector(`.led[data-physical="${led.id}"]`);if(!e)continue;e.style.color=`rgb(${led.rgb.join(",")})`;e.classList.add("on");if(led.state==="APPROACHING")e.classList.add("approaching")}$("status").textContent=`${frame.leds?.length||0}/${frame.ledCount} aktive · ${new Date().toLocaleTimeString()}`}async function refresh(){clearTimeout(timer);if(!testing)try{paint(await json(`${FEED}${board.id}/frame`))}catch(e){$("status").textContent=`Feedfeil: ${e.message}`}timer=setTimeout(refresh,10000)}async function load(){clearTimeout(timer);board=await json(`${BASE}boards/${$("board").value}.json`);hardware=await json(`${BASE}hardware/${board.id}-hardware.json`).catch(()=>({assignments:board.nodes.map(n=>({sourceNodeId:n.id,logicalLed:n.led,physicalLed:n.led}))}));layout=JSON.parse(localStorage.getItem(key())||"null")||{};if(!Object.keys(layout).length)autoPlace();else draw();refresh()}$("board").onchange=load;$("image").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{$("stage").style.backgroundImage=`url(${r.result})`;localStorage.setItem(key()+"-image",r.result)};r.readAsDataURL(f)};$("edit").onclick=()=>{$("edit").classList.toggle("active",editing=!editing);$("status").textContent=editing?"Dra LED-punktene til riktig sted":"Flytting avsluttet"};$("auto").onclick=()=>{autoPlace();$("status").textContent="Automatisk plassering klar"};$("save").onclick=()=>{localStorage.setItem(key(),JSON.stringify(layout));$("status").textContent="Kartlayout lagret i denne nettleseren"};$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:1,boardProfile:board.id,background:"user-supplied",positions:layout},null,2)],{type:"application/json"}));a.download=`${board.id}-map-layout.json`;a.click()};$("test").onclick=()=>{testing=!testing;$("test").classList.toggle("active",testing);if(!testing)return refresh();let i=0;const step=()=>{if(!testing)return;paint({ledCount:board.leds.count,leds:[{id:i++%board.leds.count,rgb:[255,255,255],state:"AT_STOP"}]});setTimeout(step,180)};step()};load().then(()=>{const bg=localStorage.getItem(key()+"-image");if(bg)$("stage").style.backgroundImage=`url(${bg})`}).catch(e=>$("status").textContent=e.message);</script></body></html>
