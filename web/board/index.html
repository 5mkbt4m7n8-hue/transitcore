<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>TransitCore LED-tavlesimulator</title>
<style>
:root{color-scheme:dark;--bg:#0b0d11;--panel:#151922;--line:#2a303c;--muted:#929aaa;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}main{max-width:1200px;margin:auto}
h1{font-size:24px;margin:0 0 4px}.sub,.note{color:var(--muted);font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
button,select{font:inherit;color:#fff;background:#222834;border:1px solid #3b4352;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover,select:hover{border-color:#697386}button.active{border-color:var(--accent);background:#172b48}
#status{min-height:21px;margin:8px 0 14px;color:#c5cad3;font-size:13px}.ok{color:#7ee2a8!important}.error{color:#ff8585!important}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}.line-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px}.swatch{width:10px;height:10px;border-radius:50%;background:var(--color)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}.led{position:relative;min-height:105px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#11151c;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}.led.approaching{border-color:color-mix(in srgb,var(--glow) 45%,var(--line));background:color-mix(in srgb,var(--glow) 6%,#11151c)}.led.active{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 15%,#11151c);box-shadow:0 0 18px color-mix(in srgb,var(--glow) 65%,transparent);transform:translateY(-1px)}
.lamp{width:20px;height:20px;border-radius:50%;background:#333b49;border:2px solid #596170;margin-bottom:8px}.approaching .lamp{background:color-mix(in srgb,var(--glow) 35%,#333b49);border-color:var(--glow)}.active .lamp{background:var(--glow);border-color:#fff;box-shadow:0 0 16px var(--glow)}.num{position:absolute;right:9px;top:8px;color:#788193;font:11px ui-monospace,SFMono-Regular,monospace}.name{font-weight:650;font-size:13px;line-height:1.2}.routes,.direction{margin-top:6px;color:#8992a3;font-size:11px}.direction{color:#c1c7d1}.arrival{margin-top:5px;color:#fff;font-size:11px}.monitor{margin:10px 0 16px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.monitor-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.monitor-title{font-weight:750}.monitor-state{padding:4px 8px;border-radius:999px;background:#293142;font-size:12px}.monitor-state.ok{background:#123b28;color:#7ee2a8!important}.monitor-state.warn{background:#493415;color:#ffd27a!important}.monitor-state.error{background:#4b2025;color:#ff9b9b!important}.monitor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.monitor-item{padding:9px;background:#10141b;border-radius:9px;color:var(--muted);font-size:12px}.monitor-item b{display:block;color:#f7f8fa;font-size:14px;margin-bottom:2px}.monitor-history{margin-top:12px}.monitor-history summary{cursor:pointer;color:#c8d2e1}.history-row{display:grid;grid-template-columns:135px 110px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12px}.history-state{font-weight:750}.history-state.OK{color:#7ee2a8}.history-state.FEED_ERROR,.history-state.PROFILE_MISMATCH{color:#ff9b9b}@media(max-width:600px){.history-row{grid-template-columns:1fr}.history-row span{display:block}}.note{margin:17px 0 4px;line-height:1.45}
@media(max-width:520px){body{padding:12px}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.led{min-height:100px}}
</style>
</head>
<body><main>
<h1>TransitCore LED-tavlesimulator</h1>
<div class="sub" id="subtitle">Laster tavleprofil…</div>
<div class="toolbar"><select id="boardSelect" aria-label="Velg tavle"><option value="oslo-metro-board">Oslo T-bane – begge retninger / felles LED</option><option value="oslo-metro-board-direction-a">Oslo T-bane – retning A</option><option value="oslo-metro-board-direction-b">Oslo T-bane – retning B</option><option value="oslo-metro-wizard-separate">Oslo linje 1 – separate LED-er</option><option value="trondheim-bus-board">Trondheim buss</option></select><button id="refresh">Oppdater live</button><button id="test">Test alle LED-er</button><button id="stop">Stopp test</button><button id="importHardware">Importer hardwareprofil</button><button id="clearHardware">Bruk logisk rekkefølge</button><input id="hardwareFile" type="file" accept="application/json,.json" hidden></div>
<div id="status">Laster tavleprofil…</div><section class="monitor" aria-live="polite"><div class="monitor-head"><span class="monitor-title">Publisert tavle · drift</span><span id="monitorState" class="monitor-state">Kontrollerer…</span></div><div id="monitorGrid" class="monitor-grid"></div><details class="monitor-history"><summary>Vis lagret historikk</summary><div id="monitorHistory" class="note">Laster historikk…</div></details></section><div id="legend" class="legend"></div><section id="board" class="board" aria-label="Logisk LED-tavle"></section>
<p class="note" id="note">LED-numrene er foreløpig logiske, ikke fysisk ledningsrekkefølge.</p>
</main>
<script>
const $=id=>document.getElementById(id),ROUTE_BASE="../../config/routes/",CLIENT="lgb-transitcore-board-simulator",WORKER="https://transitcore-led-feed.lgb84.workers.dev",BOARD_FILES={"oslo-metro-board":"../../config/boards/oslo-metro-board.json","oslo-metro-board-direction-a":"../../config/boards/oslo-metro-board-direction-a.json","oslo-metro-board-direction-b":"../../config/boards/oslo-metro-board-direction-b.json","oslo-metro-wizard-separate":"../../config/boards/oslo-metro-wizard-separate.json","trondheim-bus-board":"../../config/boards/trondheim-bus-board.json"},HARDWARE_FILES={"oslo-metro-wizard-separate":"../../config/hardware/oslo-metro-wizard-separate-hardware.json"};
let board,profiles=[],activeByLed=new Map(),refreshTimer,monitorTimer,testTimer,collisionTimer,testing=false,collisionStep=0,hardwareProfile=null,physicalByLogical=new Map();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function json(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw Error(`${path}: HTTP ${r.status}`);return r.json()}
function color(profile,destination=""){const d=destination.toLowerCase(),match=profile.directions?.find(x=>x.destinationMatches.some(s=>d.includes(s.toLowerCase())));return match?.color||profile.line.color||profile.directions?.[0]?.color||"#60a5fa"}
function renderLegend(){$("legend").innerHTML=profiles.map(p=>`<span class="line-badge" style="--color:${color(p)}"><i class="swatch"></i>Linje ${esc(p.line.publicCode)}</span>`).join("")}
function nodeDirectionLabel(n){if(!n.routeDirections)return"";const matches=[...new Set(Object.values(n.routeDirections).flatMap(x=>x.destinationMatches||[]))];return `${n.platformCount>1?`spor ${n.track}/${n.platformCount}`:"ett spor"}${matches.length?` · mot ${matches.join(" / ")}`:""}`}
function physicalLed(logicalLed){return physicalByLogical.get(logicalLed)??logicalLed}
function renderBoard(){const cards=[...board.nodes].sort((a,b)=>physicalLed(a.led)-physicalLed(b.led));$("board").innerHTML=cards.map(n=>`<article class="led" id="led-${n.led}" data-led="${n.led}"><span class="num">LED ${String(physicalLed(n.led)).padStart(3,"0")}</span><div class="lamp"></div><div class="name">${esc(n.name)}</div><div class="routes">Linje ${n.routes.map(id=>esc(profiles.find(p=>p.id===id)?.line.publicCode||"?")).join(", ")}</div>${n.routeDirections?`<div class="direction">${esc(nodeDirectionLabel(n))}</div>`:""}<div class="arrival"></div></article>`).join("")}
function paint(){for(const n of board.nodes){const el=$(`led-${n.led}`),items=activeByLed.get(n.led)||[],strong=items.filter(x=>x.state!=="approaching"),shown=(strong.length?strong:items)[collisionStep%(strong.length||items.length||1)];el.classList.toggle("active",strong.length>0);el.classList.toggle("approaching",!strong.length&&items.length>0);if(!shown){el.style.removeProperty("--glow");el.querySelector(".arrival").textContent="";continue}el.style.setProperty("--glow",color(shown.profile,shown.destination));el.querySelector(".arrival").textContent=`Linje ${shown.profile.line.publicCode} · ${shown.state==="approaching"?"NÆRMER SEG":"VED HOLDEPLASS"}${shown.destination?` · ${shown.destination}`:""}${shown.node?.track?` · spor ${shown.node.track}`:""}`}}
function stopTest(){testing=false;clearInterval(testTimer);$("test").classList.remove("active");activeByLed.clear();paint()}
function startTest(){stopTest();testing=true;$("test").classList.add("active");let i=-1;const step=()=>{activeByLed.clear();i++;if(i>=board.leds.count){stopTest();$("status").textContent=`LED-test fullført · alle ${board.leds.count} posisjoner kontrollert`;return}const n=board.nodes.find(x=>physicalLed(x.led)===i),profile=profiles.find(p=>n.routes.includes(p.id))||profiles[0];activeByLed.set(n.led,[{profile,destination:"TEST",state:"at-stop"}]);paint();$("status").textContent=`LED-test ${i+1}/${board.leds.count} · fysisk LED ${String(i).padStart(3,"0")} · ${n.name}`;document.getElementById(`led-${n.led}`)?.scrollIntoView({block:"nearest"})};step();testTimer=setInterval(step,350)}
function hardwareKey(){return `transitcore-board-hardware-${board.id}-v1`}
function validateHardware(data){if(data?.schemaVersion!==1)throw Error("Ukjent schemaVersion");if(data.boardProfile!==board.id)throw Error(`Profilen tilhører ${data.boardProfile||"en annen tavle"}`);if(!Array.isArray(data.assignments)||data.assignments.length!==board.nodes.length)throw Error(`Forventet ${board.nodes.length} LED-oppføringer`);const logical=new Set,physical=new Set;for(const a of data.assignments){if(!Number.isInteger(a.logicalLed)||!board.nodes.some(n=>n.led===a.logicalLed))throw Error(`Ukjent logisk LED ${a.logicalLed}`);if(!Number.isInteger(a.physicalLed)||a.physicalLed<0||a.physicalLed>=data.assignments.length)throw Error(`Ugyldig fysisk LED ${a.physicalLed}`);if(logical.has(a.logicalLed))throw Error(`Duplikat logisk LED ${a.logicalLed}`);if(physical.has(a.physicalLed))throw Error(`Duplikat fysisk LED ${a.physicalLed}`);logical.add(a.logicalLed);physical.add(a.physicalLed)}return data}
function applyHardware(data,persist=true){hardwareProfile=validateHardware(data);physicalByLogical=new Map(data.assignments.map(a=>[a.logicalLed,a.physicalLed]));if(persist)localStorage.setItem(hardwareKey(),JSON.stringify(data));renderBoard();paint();$("subtitle").textContent=`${board.name} · ${board.leds.count} fysiske LED-er · linje ${profiles.map(p=>p.line.publicCode).join(" og ")}`;$("note").textContent=`Hardwareprofil aktiv: ${data.name||data.id}. Kortene og LED-testen følger fysisk rekkefølge 0–${board.leds.count-1}; live-data kobles fortsatt via de uendrede logiske LED-numrene.`}
async function importHardware(file){if(!file)return;applyHardware(JSON.parse(await file.text()));$("status").className="ok";$("status").textContent=`Hardwareprofil importert · ${board.leds.count} fysiske LED-er`}
function clearHardware(){localStorage.removeItem(hardwareKey());hardwareProfile=null;physicalByLogical.clear();renderBoard();paint();setBoardText();$("status").className="ok";$("status").textContent="Viser logisk LED-rekkefølge"}
function setBoardText(){$("subtitle").textContent=`${board.name} · ${board.leds.count} logiske ${board.directionalPlatforms?"plattform":"holdeplass"}-LED-er · linje ${profiles.map(p=>p.line.publicCode).join(" og ")}`;$("note").textContent=board.positioning==="vehicle-proximity"?`LED-numrene er logiske. ${board.directionalPlatforms?"Hver GTFS-quay og retning har eget LED-punkt. ":""}Svak glød betyr at en GPS-rapportert buss er innen 250 meter; fullt lys betyr innen 85 meter. Data eldre enn 120 sekunder ignoreres.`:"LED-numrene er logiske. En LED lyser rundt Enturs beregnede ankomsttid. Delte stasjoner veksler mellom aktive linjefarger."}
async function fetchProfile(profile){const cfg=profile.positioning,now=Date.now(),start=new Date(now-cfg.lookBehindSeconds*1000).toISOString(),range=cfg.lookBehindSeconds+cfg.lookAheadSeconds,targets=[];profile.stops.forEach((stop,stationIndex)=>(stop.quayIds?.length?stop.quayIds:[stop.id]).forEach(quayId=>targets.push({stop,stationIndex,quayId})));const fields="aimedArrivalTime expectedArrivalTime aimedDepartureTime expectedDepartureTime destinationDisplay{frontText} serviceJourney{id journeyPattern{line{id publicCode}}}";const aliases=targets.map((t,i)=>`q${i}:quay(id:"${t.quayId}"){estimatedCalls(startTime:"${start}",timeRange:${range},numberOfDepartures:6){${fields}}}`).join("\n"),r=await fetch(cfg.endpoint,{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":CLIENT},body:JSON.stringify({query:`{${aliases}}`})});if(!r.ok)throw Error(`Linje ${profile.line.publicCode}: HTTP ${r.status}`);const data=await r.json();if(data.errors?.length)throw Error(`Linje ${profile.line.publicCode}: ${data.errors[0].message}`);const found=new Map;targets.forEach((t,i)=>{for(const call of data.data?.[`q${i}`]?.estimatedCalls||[]){const line=call.serviceJourney?.journeyPattern?.line;if(String(line?.publicCode||"")!==profile.line.publicCode&&line?.id!==profile.line.id)continue;const destination=call.destinationDisplay?.frontText||"",when=Date.parse(call.expectedArrivalTime||call.aimedArrivalTime||call.expectedDepartureTime||call.aimedDepartureTime||"");if(!Number.isFinite(when)||Math.abs(when-now)>cfg.stationWindowSeconds*1000)continue;const node=board.nodes.find(n=>n.routes.includes(profile.id)&&n.stopIds.includes(t.quayId)&&(!n.routeDirections||matchesDestination(n,profile,destination)));if(!node)continue;const key=`${call.serviceJourney?.id||"tog"}-${node.led}`;found.set(key,{led:node.led,profile,destination,when})}});return [...found.values()]}
const rad=v=>v*Math.PI/180;
function distance(a,b){const R=6371000,p1=rad(a.lat),p2=rad(b.lat),dp=rad(b.lat-a.lat),dl=rad(b.lon-a.lon),x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function profileDirectionId(profile,destination){const dest=destination.toLowerCase(),direction=profile.directions?.find(d=>d.destinationMatches.some(value=>dest.includes(value.toLowerCase())));return direction?(direction.reverseShape?"1":"0"):null}
function matchesDestination(node,profile,destination){const routeDirection=node.routeDirections?.[profile.id],values=routeDirection?.destinationMatches||[],dest=destination.toLowerCase();if(values.some(value=>{const match=value.toLowerCase();return dest.includes(match)||match.includes(dest)}))return true;if(dest&&values.length)return false;const directionId=profileDirectionId(profile,destination);return directionId!=null&&routeDirection?.directionIds?.includes(directionId)}
async function fetchBusBoard(){const query=`{vehicles(codespaceId:"ATB"){vehicleId lastUpdated destinationName line{publicCode} location{latitude longitude}}}`,r=await fetch(profiles[0].provider.vehicleEndpoint,{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":CLIENT},body:JSON.stringify({query})});if(!r.ok)throw Error(`Entur HTTP ${r.status}`);const data=await r.json();if(data.errors?.length)throw Error(data.errors[0].message);const byLine=new Map(profiles.map(p=>[String(p.line.publicCode),p])),dedupe=new Map;for(const v of data.data?.vehicles||[]){const profile=byLine.get(String(v.line?.publicCode||""));if(!profile||v.location?.latitude==null)continue;const updated=Date.parse(v.lastUpdated||"");if(!Number.isFinite(updated)||(Date.now()-updated)/1000>board.render.freshnessSeconds)continue;const old=dedupe.get(v.vehicleId);if(!old||updated>old.updated)dedupe.set(v.vehicleId,{profile,updated,destination:v.destinationName||"",lat:Number(v.location.latitude),lon:Number(v.location.longitude)})}const found=[];for(const v of dedupe.values()){const routeNodes=board.nodes.filter(n=>n.routes.includes(v.profile.id)),directionNodes=board.directionalPlatforms?routeNodes.filter(n=>matchesDestination(n,v.profile,v.destination)):routeNodes,candidates=directionNodes.length?directionNodes:routeNodes;let best=null,bestDistance=Infinity;for(const n of candidates){const d=distance(v,n);if(d<bestDistance){best=n;bestDistance=d}}if(best&&bestDistance<=board.render.approachRadiusMeters)found.push({led:best.led,node:best,profile:v.profile,destination:v.destination,state:bestDistance<=board.render.arrivalRadiusMeters?"at-stop":"approaching",distance:bestDistance})}return found}
function monitorCard(label,value){return `<div class="monitor-item"><b>${esc(value)}</b>${esc(label)}</div>`}
function renderMonitorHistory(data){
 const rows=[...(data.history||[])].reverse().slice(0,24);
 $("monitorHistory").innerHTML=rows.length?rows.map(item=>`<div class="history-row"><span>${esc(new Date(item.recordedAt||item.checkedAt).toLocaleString("no-NO"))}</span><span class="history-state ${esc(item.state)}">${esc(item.state==="OK"?"OK":item.state==="FEED_ERROR"?"Feed-feil":"Profilavvik")}</span><span>${esc(item.detail||"")} ${Number.isFinite(item.activeLeds)?"· "+item.activeLeds+" aktive LED-er":""}</span></div>`).join(""):"Ingen historikk er lagret ennå.";
}
async function loadMonitorHistory(){
 try{const response=await fetch(`${WORKER}/v1/boards/${encodeURIComponent(board.id)}/history`,{cache:"no-store"}),data=await response.json();if(response.ok)renderMonitorHistory(data)}
 catch(error){console.warn("Historikk",error)}
}
async function monitorPublishedBoard(){
 clearTimeout(monitorTimer);
 const state=$("monitorState"),grid=$("monitorGrid"),expected=hardwareProfile?.leds?.count??board.leds.count;
 try{
  const frameResponse=await fetch(`${WORKER}/v1/boards/${encodeURIComponent(board.id)}/frame`,{cache:"no-store"}),frame=await frameResponse.json().catch(()=>({}));
  if(!frameResponse.ok)throw Error(frameResponse.status===404?"Tavleprofilen finnes ikke i Worker":`Feed HTTP ${frameResponse.status}`);
  if(frame.schemaVersion!==1||frame.boardProfile!==board.id||frame.ledCount!==expected){state.className="monitor-state error";state.textContent="Profilavvik";grid.innerHTML=monitorCard("Forventet tavle",board.id)+monitorCard("Mottatt tavle",frame.boardProfile||"mangler")+monitorCard("Forventet LED-antall",expected)+monitorCard("Mottatt LED-antall",frame.ledCount??"mangler");return}
  const generated=Date.parse(frame.generatedAt||""),age=Number.isFinite(generated)?Math.max(0,Math.floor((Date.now()-generated)/1000)):Infinity,ttl=Number(frame.ttlSeconds)||30;
  if(age>ttl){state.className="monitor-state error";state.textContent="Utløpt frame";grid.innerHTML=monitorCard("Frame-alder",Number.isFinite(age)?age+" sek":"ukjent")+monitorCard("Tillatt alder",ttl+" sek");return}
  let esp="Ikke registrert",espClass="warn",lastSeen="–";
  try{
   const deviceResponse=await fetch(`${WORKER}/v1/devices/${encodeURIComponent(board.id)}/status`,{cache:"no-store"}),device=await deviceResponse.json();
   if(deviceResponse.ok&&device.latest){const deviceAge=Math.max(0,Math.floor((Date.now()-Date.parse(device.latest.receivedAt))/1000));lastSeen=deviceAge+" sek siden";if(deviceAge<=420&&device.latest.frameValid){esp="Online";espClass="ok"}else{esp="Frakoblet";espClass="error"}}
  }catch(error){console.warn("ESP-status",error)}
  state.className="monitor-state "+espClass;state.textContent=espClass==="ok"?"OK":espClass==="error"?"ESP frakoblet":"Worker OK · ESP ikke registrert";
  grid.innerHTML=monitorCard("Worker-feed","Gyldig")+monitorCard("Frame-alder",age+" sek")+monitorCard("Aktive LED-er",(frame.leds||[]).length)+monitorCard("ESP",esp)+monitorCard("ESP sist sett",lastSeen);
 }catch(error){state.className="monitor-state error";state.textContent="Feed-feil";grid.innerHTML=monitorCard("Worker-feed",error.message)}
 finally{await loadMonitorHistory();monitorTimer=setTimeout(monitorPublishedBoard,30000)}
}
async function refresh(){if(testing)return;clearTimeout(refreshTimer);$("status").className="";$("status").textContent=`Henter live-data for ${board.name}…`;try{const arrivals=board.positioning==="vehicle-proximity"?await fetchBusBoard():(await Promise.all(profiles.map(fetchProfile))).flat();activeByLed.clear();for(const a of arrivals){if(!activeByLed.has(a.led))activeByLed.set(a.led,[]);activeByLed.get(a.led).push(a)}paint();const strong=arrivals.filter(x=>x.state!=="approaching").length,near=arrivals.length-strong;$("status").className="ok";$("status").textContent=board.positioning==="vehicle-proximity"?`${strong} ved holdeplass · ${near} nærmer seg · ${new Date().toLocaleTimeString()}`:`${activeByLed.size} aktive stasjons-LED-er · ${arrivals.length} ankomster · ${new Date().toLocaleTimeString()}`}catch(e){console.error(e);$("status").className="error";$("status").textContent=`Livefeil: ${e.message}`}finally{refreshTimer=setTimeout(refresh,board.positioning==="vehicle-proximity"?10000:30000)}}
async function init(){try{const requested=new URLSearchParams(location.search).get("board")||"oslo-metro-board",path=BOARD_FILES[requested]||BOARD_FILES["oslo-metro-board"];$('boardSelect').value=requested in BOARD_FILES?requested:"oslo-metro-board";board=await json(path);profiles=await Promise.all(board.routes.map(id=>json(`${ROUTE_BASE}${id}.json`)));if(board.nodes.length!==board.leds.count)throw Error(`Profilen har ${board.nodes.length} noder, men ${board.leds.count} LED-er`);setBoardText();renderLegend();const saved=localStorage.getItem(hardwareKey());if(saved){try{applyHardware(JSON.parse(saved),false)}catch(e){localStorage.removeItem(hardwareKey());console.warn(e);renderBoard()}}else if(HARDWARE_FILES[board.id]){applyHardware(await json(HARDWARE_FILES[board.id]),false)}else renderBoard();collisionTimer=setInterval(()=>{collisionStep++;if(!testing)paint()},1200);monitorPublishedBoard();await refresh()}catch(e){console.error(e);$("status").className="error";$("status").textContent=`Oppstartsfeil: ${e.message}`}}
$("boardSelect").onchange=e=>location.search=`?board=${encodeURIComponent(e.target.value)}`;$("refresh").onclick=()=>{stopTest();refresh()};$("test").onclick=startTest;$("stop").onclick=()=>{stopTest();refresh()};$("importHardware").onclick=()=>$("hardwareFile").click();$("hardwareFile").onchange=async e=>{try{await importHardware(e.target.files[0])}catch(err){$("status").className="error";$("status").textContent=`Importfeil: ${err.message}`}finally{e.target.value=""}};$("clearHardware").onclick=clearHardware;init();
</script></body></html>
