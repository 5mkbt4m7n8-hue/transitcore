<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>TransitCore LED-tavlesimulator</title>
<style>
:root{color-scheme:dark;--bg:#0b0d11;--panel:#151922;--line:#2a303c;--muted:#929aaa;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:18px}main{max-width:1200px;margin:auto}
h1{font-size:24px;margin:0 0 4px}.sub,.note{color:var(--muted);font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
button,select{font:inherit;color:#fff;background:#222834;border:1px solid #3b4352;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover,select:hover{border-color:#697386}button.active{border-color:var(--accent);background:#172b48}
#status{min-height:21px;margin:8px 0 14px;color:#c5cad3;font-size:13px}.ok{color:#7ee2a8!important}.error{color:#ff8585!important}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}.line-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px}.swatch{width:10px;height:10px;border-radius:50%;background:var(--color)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}.led{position:relative;min-height:105px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#11151c;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}.led.approaching{border-color:color-mix(in srgb,var(--glow) 45%,var(--line));background:color-mix(in srgb,var(--glow) 6%,#11151c)}.led.active{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 15%,#11151c);box-shadow:0 0 18px color-mix(in srgb,var(--glow) 65%,transparent);transform:translateY(-1px)}
.lamp{width:20px;height:20px;border-radius:50%;background:#333b49;border:2px solid #596170;margin-bottom:8px}.approaching .lamp{background:color-mix(in srgb,var(--glow) 35%,#333b49);border-color:var(--glow)}.active .lamp{background:var(--glow);border-color:#fff;box-shadow:0 0 16px var(--glow)}.num{position:absolute;right:9px;top:8px;color:#788193;font:11px ui-monospace,SFMono-Regular,monospace}.name{font-weight:650;font-size:13px;line-height:1.2}.routes{margin-top:7px;color:#8992a3;font-size:11px}.arrival{margin-top:5px;color:#fff;font-size:11px}.note{margin:17px 0 4px;line-height:1.45}
@media(max-width:520px){body{padding:12px}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.led{min-height:100px}}
</style>
</head>
<body><main>
<h1>TransitCore LED-tavlesimulator</h1>
<div class="sub" id="subtitle">Laster tavleprofil…</div>
<div class="toolbar"><select id="boardSelect" aria-label="Velg tavle"><option value="oslo-metro-board">Oslo T-bane</option><option value="trondheim-bus-board">Trondheim buss</option></select><button id="refresh">Oppdater live</button><button id="test">Test alle LED-er</button><button id="stop">Stopp test</button></div>
<div id="status">Laster tavleprofil…</div><div id="legend" class="legend"></div><section id="board" class="board" aria-label="Logisk LED-tavle"></section>
<p class="note" id="note">LED-numrene er foreløpig logiske, ikke fysisk ledningsrekkefølge.</p>
</main>
<script>
const $=id=>document.getElementById(id),ROUTE_BASE="../../config/routes/",CLIENT="lgb-transitcore-board-simulator",BOARD_FILES={"oslo-metro-board":"../../config/boards/oslo-metro-board.json","trondheim-bus-board":"../../config/boards/trondheim-bus-board.json"};
let board,profiles=[],activeByLed=new Map(),refreshTimer,testTimer,collisionTimer,testing=false,collisionStep=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function json(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw Error(`${path}: HTTP ${r.status}`);return r.json()}
function color(profile,destination=""){const d=destination.toLowerCase(),match=profile.directions?.find(x=>x.destinationMatches.some(s=>d.includes(s.toLowerCase())));return match?.color||profile.line.color||profile.directions?.[0]?.color||"#60a5fa"}
function renderLegend(){$("legend").innerHTML=profiles.map(p=>`<span class="line-badge" style="--color:${color(p)}"><i class="swatch"></i>Linje ${esc(p.line.publicCode)}</span>`).join("")}
function renderBoard(){const cards=[...board.nodes].sort((a,b)=>a.led-b.led);$("board").innerHTML=cards.map(n=>`<article class="led" id="led-${n.led}" data-led="${n.led}"><span class="num">LED ${String(n.led).padStart(2,"0")}</span><div class="lamp"></div><div class="name">${esc(n.name)}</div><div class="routes">Linje ${n.routes.map(id=>esc(profiles.find(p=>p.id===id)?.line.publicCode||"?")).join(", ")}</div><div class="arrival"></div></article>`).join("")}
function paint(){for(const n of board.nodes){const el=$(`led-${n.led}`),items=activeByLed.get(n.led)||[],strong=items.filter(x=>x.state!=="approaching"),shown=(strong.length?strong:items)[collisionStep%(strong.length||items.length||1)];el.classList.toggle("active",strong.length>0);el.classList.toggle("approaching",!strong.length&&items.length>0);if(!shown){el.style.removeProperty("--glow");el.querySelector(".arrival").textContent="";continue}el.style.setProperty("--glow",color(shown.profile,shown.destination));el.querySelector(".arrival").textContent=`Linje ${shown.profile.line.publicCode} · ${shown.state==="approaching"?"NÆRMER SEG":"VED HOLDEPLASS"}${shown.destination?` · ${shown.destination}`:""}`}}
function stopTest(){testing=false;clearInterval(testTimer);$("test").classList.remove("active");activeByLed.clear();paint()}
function startTest(){stopTest();testing=true;$("test").classList.add("active");let i=-1;const step=()=>{activeByLed.clear();i++;if(i>=board.leds.count){stopTest();$("status").textContent=`LED-test fullført · alle ${board.leds.count} posisjoner kontrollert`;return}const n=board.nodes.find(x=>x.led===i),profile=profiles.find(p=>n.routes.includes(p.id))||profiles[0];activeByLed.set(i,[{profile,destination:"TEST",state:"at-stop"}]);paint();$("status").textContent=`LED-test ${i+1}/${board.leds.count} · LED ${String(i).padStart(2,"0")} · ${n.name}`;document.getElementById(`led-${i}`)?.scrollIntoView({block:"nearest"})};step();testTimer=setInterval(step,350)}
async function fetchProfile(profile){const cfg=profile.positioning,now=Date.now(),start=new Date(now-cfg.lookBehindSeconds*1000).toISOString(),range=cfg.lookBehindSeconds+cfg.lookAheadSeconds,targets=[];profile.stops.forEach((stop,stationIndex)=>(stop.quayIds?.length?stop.quayIds:[stop.id]).forEach(quayId=>targets.push({stop,stationIndex,quayId})));const fields="aimedArrivalTime expectedArrivalTime aimedDepartureTime expectedDepartureTime destinationDisplay{frontText} serviceJourney{id journeyPattern{line{id publicCode}}}";const aliases=targets.map((t,i)=>`q${i}:quay(id:"${t.quayId}"){estimatedCalls(startTime:"${start}",timeRange:${range},numberOfDepartures:6){${fields}}}`).join("\n"),r=await fetch(cfg.endpoint,{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":CLIENT},body:JSON.stringify({query:`{${aliases}}`})});if(!r.ok)throw Error(`Linje ${profile.line.publicCode}: HTTP ${r.status}`);const data=await r.json();if(data.errors?.length)throw Error(`Linje ${profile.line.publicCode}: ${data.errors[0].message}`);const found=new Map;targets.forEach((t,i)=>{for(const call of data.data?.[`q${i}`]?.estimatedCalls||[]){const line=call.serviceJourney?.journeyPattern?.line;if(String(line?.publicCode||"")!==profile.line.publicCode&&line?.id!==profile.line.id)continue;const when=Date.parse(call.expectedArrivalTime||call.aimedArrivalTime||call.expectedDepartureTime||call.aimedDepartureTime||"");if(!Number.isFinite(when)||Math.abs(when-now)>cfg.stationWindowSeconds*1000)continue;const node=board.nodes.find(n=>n.stopIds.includes(t.quayId));if(!node)continue;const key=`${call.serviceJourney?.id||"tog"}-${node.led}`;found.set(key,{led:node.led,profile,destination:call.destinationDisplay?.frontText||"",when})}});return [...found.values()]}
const rad=v=>v*Math.PI/180;
function distance(a,b){const R=6371000,p1=rad(a.lat),p2=rad(b.lat),dp=rad(b.lat-a.lat),dl=rad(b.lon-a.lon),x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
async function fetchBusBoard(){const query=`{vehicles(codespaceId:"ATB"){vehicleId lastUpdated destinationName line{publicCode} location{latitude longitude}}}`,r=await fetch(profiles[0].provider.vehicleEndpoint,{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":CLIENT},body:JSON.stringify({query})});if(!r.ok)throw Error(`Entur HTTP ${r.status}`);const data=await r.json();if(data.errors?.length)throw Error(data.errors[0].message);const byLine=new Map(profiles.map(p=>[String(p.line.publicCode),p])),dedupe=new Map;for(const v of data.data?.vehicles||[]){const profile=byLine.get(String(v.line?.publicCode||""));if(!profile||v.location?.latitude==null)continue;const updated=Date.parse(v.lastUpdated||"");if(!Number.isFinite(updated)||(Date.now()-updated)/1000>board.render.freshnessSeconds)continue;const old=dedupe.get(v.vehicleId);if(!old||updated>old.updated)dedupe.set(v.vehicleId,{profile,updated,destination:v.destinationName||"",lat:Number(v.location.latitude),lon:Number(v.location.longitude)})}const found=[];for(const v of dedupe.values()){let best=null,bestDistance=Infinity;for(const n of board.nodes){if(!n.routes.includes(v.profile.id))continue;const d=distance(v,n);if(d<bestDistance){best=n;bestDistance=d}}if(best&&bestDistance<=board.render.approachRadiusMeters)found.push({led:best.led,profile:v.profile,destination:v.destination,state:bestDistance<=board.render.arrivalRadiusMeters?"at-stop":"approaching",distance:bestDistance})}return found}
async function refresh(){if(testing)return;clearTimeout(refreshTimer);$("status").className="";$("status").textContent=`Henter live-data for ${board.name}…`;try{const arrivals=board.positioning==="vehicle-proximity"?await fetchBusBoard():(await Promise.all(profiles.map(fetchProfile))).flat();activeByLed.clear();for(const a of arrivals){if(!activeByLed.has(a.led))activeByLed.set(a.led,[]);activeByLed.get(a.led).push(a)}paint();const strong=arrivals.filter(x=>x.state!=="approaching").length,near=arrivals.length-strong;$("status").className="ok";$("status").textContent=board.positioning==="vehicle-proximity"?`${strong} ved holdeplass · ${near} nærmer seg · ${new Date().toLocaleTimeString()}`:`${activeByLed.size} aktive stasjons-LED-er · ${arrivals.length} ankomster · ${new Date().toLocaleTimeString()}`}catch(e){console.error(e);$("status").className="error";$("status").textContent=`Livefeil: ${e.message}`}finally{refreshTimer=setTimeout(refresh,board.positioning==="vehicle-proximity"?10000:30000)}}
async function init(){try{const requested=new URLSearchParams(location.search).get("board")||"oslo-metro-board",path=BOARD_FILES[requested]||BOARD_FILES["oslo-metro-board"];$('boardSelect').value=requested in BOARD_FILES?requested:"oslo-metro-board";board=await json(path);profiles=await Promise.all(board.routes.map(id=>json(`${ROUTE_BASE}${id}.json`)));if(board.nodes.length!==board.leds.count)throw Error(`Profilen har ${board.nodes.length} noder, men ${board.leds.count} LED-er`);$("subtitle").textContent=`${board.name} · ${board.leds.count} logiske holdeplass-LED-er · linje ${profiles.map(p=>p.line.publicCode).join(" og ")}`;$("note").textContent=board.positioning==="vehicle-proximity"?"LED-numrene er logiske. Svak glød betyr at en GPS-rapportert buss er innen 250 meter; fullt lys betyr innen 85 meter fra holdeplassen. Data eldre enn 120 sekunder ignoreres.":"LED-numrene er logiske. En LED lyser rundt Enturs beregnede ankomsttid. Delte stasjoner veksler mellom aktive linjefarger.";renderLegend();renderBoard();collisionTimer=setInterval(()=>{collisionStep++;if(!testing)paint()},1200);await refresh()}catch(e){console.error(e);$("status").className="error";$("status").textContent=`Oppstartsfeil: ${e.message}`}}
$("boardSelect").onchange=e=>location.search=`?board=${encodeURIComponent(e.target.value)}`;$("refresh").onclick=()=>{stopTest();refresh()};$("test").onclick=startTest;$("stop").onclick=()=>{stopTest();refresh()};init();
</script></body></html>
