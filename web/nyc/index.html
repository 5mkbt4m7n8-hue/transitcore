<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TransitCore · NYC Subway 7</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#080b10;color:#f4f7fb}body{margin:0}.wrap{max-width:720px;margin:auto;padding:22px 16px 50px}h1{margin:0;font-size:clamp(25px,6vw,40px)}.sub,.status{color:#aab5c5}.badge{display:inline-grid;place-items:center;background:#9a38a1;border-radius:50%;width:42px;height:42px;margin-right:10px}.board{margin-top:20px;background:#111720;border:1px solid #293342;border-radius:18px;padding:20px;overflow:auto}.head,.station{display:grid;grid-template-columns:minmax(180px,1fr) 88px 88px;align-items:center}.head{color:#aab5c5;font-size:13px;text-align:center;padding-bottom:10px}.station{min-height:48px}.name{text-align:right;padding-right:24px;font-weight:650}.track{height:100%;display:grid;place-items:center;position:relative}.track:before{content:"";position:absolute;inset:0 auto;width:4px;background:#384455}.dot{z-index:1;width:15px;height:15px;border-radius:50%;background:#202936;border:2px solid #607087;transition:.25s}.dot.approaching{background:#9a38a1;border-color:#c986cf;animation:pulse 1.8s ease-in-out infinite}.dot.at{background:#fff;border-color:#fff;box-shadow:0 0 17px #c457cc}.eta{font-size:10px;color:#aab5c5;position:absolute;left:49px;white-space:nowrap}@keyframes pulse{0%,100%{opacity:.25;box-shadow:0 0 3px #c457cc;transform:scale(.82)}50%{opacity:.75;box-shadow:0 0 11px #c457cc;transform:scale(1)}}.error{color:#ff8585}.note{margin-top:16px;padding:14px;border-radius:12px;background:#171d27;color:#b8c3d2;font-size:14px}
</style>
<div class="wrap"><h1><span class="badge">7</span>NYC Subway Live</h1><p class="sub">Flushing–Main St ↔ 34 St–Hudson Yards · MTA GTFS-Realtime</p><div id="status" class="status">Henter sanntidsdata…</div><div class="board"><div class="head"><span>Stasjon</span><span>mot Flushing</span><span>mot Manhattan</span></div><div id="stations"></div></div><div class="note">Lilla pulsering = toget nærmer seg innen fem minutter. Hvitt lys = beregnet ved stasjonen. Dette er en isolert prototype og styrer ingen eksisterende fysisk tavle.</div></div>
<script>
const API="https://transitcore-led-feed.lgb84.workers.dev/v1/international/nyc-subway-7";
const esc=value=>String(value).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(data){const arrivals=new Map(data.arrivals.map(a=>[a.stopId,a]));stations.innerHTML=data.stations.slice().reverse().map(s=>`<div class="station"><div class="name">${esc(s.name)}</div>${["N","S"].map(d=>{const a=arrivals.get(s.id+d),state=!a||a.etaSeconds>300?"":a.etaSeconds<=30?"at":"approaching",label=!state?"":state==="at"?"nå":Math.ceil(a.etaSeconds/60)+" min";return `<div class="track"><span class="dot ${state}"></span><span class="eta">${label}</span></div>`}).join("")}</div>`).join("");status.className="status";status.textContent=`${data.arrivals.length} kommende tog · oppdatert ${new Date(data.generatedAt).toLocaleTimeString()}`}
async function refresh(){try{const response=await fetch(API,{cache:"no-store"}),data=await response.json();if(!response.ok)throw Error(data.message||data.error);render(data)}catch(error){status.className="status error";status.textContent=`MTA-feed ikke tilgjengelig: ${error.message}`;if(!stations.children.length)stations.innerHTML='<p class="error">Den offentlige MTA-feeden svarte ikke. Siden prøver automatisk igjen.</p>'}finally{setTimeout(refresh,30000)}}refresh();
</script></html>
